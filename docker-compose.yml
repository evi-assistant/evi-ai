# eVi + Ollama, glued together for a self-hosted AI server.
#
# Bring it up:
#   docker compose up -d
# Then pull a model into Ollama (once):
#   docker compose exec ollama ollama pull qwen2.5:14b-instruct-q4_K_M
# And point eVi at it:
#   docker compose exec evi evi models use qwen2.5:14b-instruct-q4_K_M
# Then sign in to http://localhost:8000 with eVi's access token:
#   docker compose exec evi evi web-config token show
# The published port reaches eVi from the Docker network, not from loopback, so
# it needs a token even from this machine. Unless you set EVI_WEB_AUTH_TOKEN
# below (or [web] auth_token in config.toml), the image generates one on first
# start and keeps it in the evi-state volume (docs/security.md, "Containers").
#
# State lives in named volumes so it survives `docker compose down`.

version: "3.9"

services:
  ollama:
    image: ollama/ollama:latest
    container_name: evi-ollama
    restart: unless-stopped
    ports:
      - "11434:11434"
    volumes:
      - ollama-data:/root/.ollama
    # If you have an NVIDIA GPU on the host, uncomment the next block
    # AFTER installing the NVIDIA Container Toolkit:
    # deploy:
    #   resources:
    #     reservations:
    #       devices:
    #         - driver: nvidia
    #           count: all
    #           capabilities: [gpu]

  evi:
    build: .
    image: evi:latest
    container_name: evi-web
    restart: unless-stopped
    depends_on:
      - ollama
    ports:
      - "8000:8000"
    environment:
      # eVi configures via ~/.evi/config.toml — but env can override common bits.
      # See evi/config.py for the full list.
      EVI_HOME: /root/.evi
      # Access token for the web UI and API from other machines (your browser
      # through the port mapping counts as one). Leave it unset to use the one
      # the image generates; to choose your own, uncomment and set a long
      # random value (e.g. `openssl rand -hex 32`):
      # EVI_WEB_AUTH_TOKEN: "<token>"
    volumes:
      - evi-state:/root/.evi
    # First-run hint: shell into the container and write a config that points
    # at the sibling ollama service.
    #
    #   docker compose exec evi sh -c 'mkdir -p /root/.evi && cat > /root/.evi/config.toml <<EOF
    #   [llm]
    #   backend  = "ollama"
    #   base_url = "http://ollama:11434/v1"
    #   model    = "qwen2.5:14b-instruct-q4_K_M"
    #   EOF'

volumes:
  ollama-data:
  evi-state:
