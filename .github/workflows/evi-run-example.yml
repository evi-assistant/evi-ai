name: evi-run (example)

# Demonstrates the reusable composite action (Phase 84). Manual-dispatch only so
# it never runs on its own. Needs an LLM backend reachable from the runner —
# set LLM_BASE_URL / LLM_API_KEY / LLM_MODEL repo secrets (any OpenAI-compatible
# endpoint works).

on:
  workflow_dispatch:
    inputs:
      prompt:
        description: "Prompt to run"
        required: true
        default: "In one sentence, what does this repository do?"
      mode:
        description: "chat | cowork | code"
        required: false
        default: "code"
      # The action approves no tool by default, so in cowork/code mode the
      # model's file and code tools are denied unless this is ticked. Tick it
      # only for your own prompts, never for untrusted text.
      auto_approve:
        description: "Approve every tool call (evi run --yes)"
        type: boolean
        required: false
        default: false

permissions:
  contents: read

jobs:
  ask:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false

      - name: Run eVi
        id: evi
        uses: ./.github/actions/evi-run
        with:
          prompt: ${{ inputs.prompt }}
          format: text
          mode: ${{ inputs.mode }}
          auto_approve: ${{ inputs.auto_approve }}
          backend: openai_compat
          base_url: ${{ secrets.LLM_BASE_URL }}
          api_key: ${{ secrets.LLM_API_KEY }}
          model: ${{ secrets.LLM_MODEL }}

      # Model output is untrusted: read it through env:, never as ${{ }} in the
      # script, and stop workflow-command parsing while printing it.
      - name: Show result
        env:
          RESULT: ${{ steps.evi.outputs.result }}
        run: |
          stop="stop-$(python3 -c 'import secrets; print(secrets.token_hex(16))')"
          echo "::group::eVi answer"
          echo "::stop-commands::$stop"
          printf '%s\n' "$RESULT"
          echo "::$stop::"
          echo "::endgroup::"
