name: ci

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  schedule:
    - cron: "0 7 * * 1"   # weekly full cross-platform sweep (Mon 07:00 UTC)
  workflow_dispatch:

permissions:
  contents: read

jobs:
  test:
    name: pytest + ruff (${{ matrix.os }} · py${{ matrix.python }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      # Every push to main runs ONE cheap Ubuntu/py3.13 job; the full
      # 3-OS matrix runs on PRs, the weekly schedule, and manual dispatch.
      # macOS bills at ~10×, so full-matrix-on-every-push was the bulk of our
      # Actions minutes — this keeps coverage where it matters (PRs + weekly)
      # at a fraction of the cost. We test the 3.12 floor AND 3.13 so the
      # supported range (>=3.12, incl. Ubuntu 24.04 LTS) stays green.
      matrix:
        os: ${{ (github.event_name == 'push') && fromJSON('["ubuntu-latest"]') || fromJSON('["ubuntu-latest", "windows-latest", "macos-latest"]') }}
        python: ["3.12", "3.13"]

    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false

      - uses: actions/setup-python@v7
        with:
          python-version: ${{ matrix.python }}

      - name: Cache pip
        uses: actions/cache@v6
        with:
          path: ~/.cache/pip
          key: ${{ runner.os }}-pip-${{ hashFiles('pyproject.toml') }}

      - name: Install
        run: |
          python -m pip install --upgrade pip
          python -m pip install -e ".[dev,web,mcp,scheduler,downloads,web-tools,index]"

      # .github/actions holds the composite actions' Python helpers and their
      # tests (the workflow-injection guard, the evi-run config writer).
      - name: Ruff
        run: python -m ruff check evi tests scripts .github/actions

      - name: Pytest
        run: python -m pytest -q --timeout=30 tests .github/actions

  rust:
    # The Tauri desktop shell was NOT covered by CI: every cargo dependency PR
    # showed "all checks green" while nothing ever compiled the Rust. A breaking
    # bump (e.g. ureq 2 -> 3, which removed RequestBuilder::timeout) only
    # surfaced during a release build — the worst place to find it. This job
    # compiles the shell and runs its unit tests on every PR.
    name: cargo check + test (desktop shell)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
        with:
          persist-credentials: false

      - uses: dtolnay/rust-toolchain@stable

      - name: Cache cargo
        uses: actions/cache@v5
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            desktop/src-tauri/target
          key: ${{ runner.os }}-cargo-${{ hashFiles('desktop/src-tauri/Cargo.lock') }}
          restore-keys: ${{ runner.os }}-cargo-

      # Tauri's Linux build needs GTK/WebKit headers even for `cargo check`.
      - name: Install Linux deps
        run: |
          sudo apt-get update
          sudo apt-get install -y libwebkit2gtk-4.1-dev libgtk-3-dev \
            libayatana-appindicator3-dev librsvg2-dev libsoup-3.0-dev

      - name: Cargo check
        working-directory: desktop/src-tauri
        run: cargo check --all-targets

      - name: Cargo test
        working-directory: desktop/src-tauri
        run: cargo test

  rust-windows:
    # The shell's Windows-only branches, such as the 1.0.53 open_external fix
    # that keeps links away from cmd.exe, only compile and run their tests on
    # Windows. A separate job (not a matrix) so the Linux check keeps its name.
    # Like the full test matrix: PRs, the weekly sweep and manual dispatch. A
    # release runs the same `cargo test` in desktop-release.yml's Windows leg
    # before it publishes, so a direct push to main is still covered.
    name: cargo check + test (desktop shell, Windows)
    if: github.event_name != 'push'
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v6
        with:
          persist-credentials: false

      - uses: dtolnay/rust-toolchain@stable

      - name: Cache cargo
        uses: actions/cache@v5
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            desktop/src-tauri/target
          key: ${{ runner.os }}-cargo-${{ hashFiles('desktop/src-tauri/Cargo.lock') }}
          restore-keys: ${{ runner.os }}-cargo-

      - name: Cargo check
        working-directory: desktop/src-tauri
        run: cargo check --all-targets

      - name: Cargo test
        working-directory: desktop/src-tauri
        run: cargo test

  actionlint:
    # Lints every workflow (and, through `uses: ./...`, the local actions' inputs)
    # for syntax, expression, type and runner-label errors. Pinned to the version
    # used locally; shellcheck runs on `run:` scripts at error severity.
    name: actionlint
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false

      - name: Install actionlint
        run: |
          bash <(curl -sSfL https://raw.githubusercontent.com/rhysd/actionlint/v1.7.12/scripts/download-actionlint.bash) 1.7.12

      - name: actionlint
        env:
          SHELLCHECK_OPTS: --severity=error
        run: ./actionlint -color -pyflakes= .github/workflows/*.yml examples/github/*.yml

  workflow-injection:
    # No `${{ ... }}` may be pasted into a run: or another script input
    # (github-script `script:`, retry `command:`, docker `args:`) — a PR title,
    # branch name or step output there is code injection. Fails on any such
    # expression (strict local check) and on zizmor's template-injection
    # findings; zizmor's other findings are printed as advisory.
    name: workflow injection (zizmor + strict check)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false

      - uses: actions/setup-python@v7
        with:
          python-version: "3.13"

      # The guard's own tests first, so a broken guard can't report "clean".
      - name: Test the guard
        run: |
          python -m pip install --quiet pytest pyyaml
          python -m pytest -q -p no:cacheprovider .github/actions/workflow-guard

      - uses: ./.github/actions/workflow-guard
        with:
          extra: examples/github/*.yml
