name: e2e

# Browser-driven UI regression tests (tests/e2e/, Playwright). The unit suite
# (ci.yml) can't catch UI rendering bugs — this can. Heavier than unit (browser
# install + a real server), so it runs on PRs, pushes to main, weekly and on
# manual dispatch. Ubuntu only.
#
# It is also the release gate: release.yml calls this workflow (workflow_call)
# and its PyPI publish job `needs` it, so a tag cut while an e2e test fails
# never reaches PyPI. 1.0.49 shipped a dead button because the release only ran
# the unit suite.
#
# Flakiness policy: every backend is stubbed (tests/e2e/conftest.py runs a fake
# OpenAI-compatible server; the real-Ollama test skips without one), a failing
# test gets ONE retry, and a test known to be flaky can be marked
# `@pytest.mark.quarantine` — it then runs in its own non-blocking step below,
# so it stays visible without blocking merges or releases. Fix or delete a
# quarantined test promptly; quarantine is not a place to keep tests.

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  schedule:
    - cron: "0 8 * * 1"   # weekly Monday 08:00 UTC
  workflow_dispatch:
  workflow_call:

permissions:
  contents: read

jobs:
  ui:
    name: playwright UI e2e
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false

      - uses: actions/setup-python@v7
        with:
          python-version: "3.13"

      - name: Install eVi + e2e deps
        run: |
          python -m pip install --upgrade pip
          python -m pip install -e ".[dev,web,mcp,scheduler,downloads,web-tools,index,e2e]" \
            "pytest-rerunfailures>=14"

      - name: Install Playwright browser
        run: python -m playwright install --with-deps chromium

      # The gate. `--reruns 1`: a test must fail twice in a row to fail the run.
      - name: Run UI e2e
        run: python -m pytest tests/e2e -m "e2e and not quarantine" --reruns 1 --timeout=120 -q

      - name: Run quarantined UI e2e (non-blocking)
        continue-on-error: true
        run: |
          rc=0
          python -m pytest tests/e2e -m "e2e and quarantine" --timeout=120 -q || rc=$?
          # Exit code 5 means nothing is quarantined — the normal case.
          if [ "$rc" -eq 5 ]; then rc=0; fi
          exit "$rc"
