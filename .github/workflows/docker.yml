name: docker

# Build + publish the eVi container image (Phase 93). Runs on version tags and
# on manual dispatch; pushes to GHCR as ghcr.io/<owner>/<repo>. The Dockerfile
# is two-stage and ships the web server + scheduler extras (no LLM backend —
# point the container at your own).

on:
  push:
    tags:
      - "v*.*.*"
  workflow_dispatch:
    inputs:
      push:
        description: "Push to GHCR (off = build only)"
        type: boolean
        default: false

permissions:
  contents: read
  packages: write   # push to GHCR

jobs:
  build-push:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      # QEMU lets the amd64 runner cross-build the arm64 image. Most deps ship
      # arm64 wheels (pydantic-core, uvloop, httptools, watchfiles), so this is
      # wheel-only and doesn't need to compile under emulation.
      - uses: docker/setup-qemu-action@v4

      - uses: docker/setup-buildx-action@v4

      # Only log in when we intend to push (tag builds, or dispatch with push=true).
      - name: Log in to GHCR
        if: github.event_name == 'push' || inputs.push
        uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Image metadata
        id: meta
        uses: docker/metadata-action@v6
        with:
          images: ghcr.io/${{ github.repository }}
          tags: |
            type=semver,pattern={{version}}
            type=semver,pattern={{major}}.{{minor}}
            type=raw,value=latest,enable=${{ github.event_name == 'push' }}

      # GHCR intermittently 403s on a blob HEAD during push — a transient
      # blob-mount quirk of buildx + the GHA cache EXPORT, not a permission
      # problem (packages: write is set, and the same push succeeds on re-run).
      # So try once with the full cache; if that flakes, retry WITHOUT the cache
      # export (the usual 403 trigger) so a release self-heals instead of
      # red-failing. Keep the two `with:` blocks in sync.
      - name: Build (and push on tags / opt-in dispatch)
        id: build
        continue-on-error: true
        uses: docker/build-push-action@v7
        with:
          context: .
          platforms: linux/amd64,linux/arm64
          push: ${{ github.event_name == 'push' || inputs.push }}
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Build and push (retry without cache export)
        if: steps.build.outcome == 'failure'
        uses: docker/build-push-action@v7
        with:
          context: .
          platforms: linux/amd64,linux/arm64
          push: ${{ github.event_name == 'push' || inputs.push }}
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha
          # No cache-to on the retry: exporting the mode=max cache is the usual
          # trigger for the blob-HEAD 403, so the retry skips it to get the
          # image pushed.
