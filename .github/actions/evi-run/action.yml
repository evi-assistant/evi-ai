name: "Run eVi"
description: "Install eVi and run a single prompt headlessly, capturing the result."
author: "eVi"
branding:
  icon: "cpu"
  color: "purple"

# A reusable composite action wrapping `evi run` (Phase 84). It installs
# evi-assistant from PyPI, writes a throwaway config pointing at your backend,
# and runs one headless prompt.
#
# eVi is the *app*, not the model — give it a backend via the `backend` /
# `base_url` / `api_key` / `model` inputs (any OpenAI-compatible endpoint, or a
# reachable Ollama). If you omit them, set EVI_HOME and pre-populate
# $EVI_HOME/config.toml yourself before this step. See docs/configuration.md.
#
# Safety, for prompts that carry untrusted text (a PR diff, an issue body):
#   - with the backend inputs set, the config this action writes approves NO
#     tool category (`[auto] auto_approve = []`, see evi_run_config.py), and
#     `evi run` without `--yes` denies every call that needs approval, so the
#     model can't read or write files or run code unless you set
#     `auto_approve: "true"` (which approves every call). If you bring your own
#     $EVI_HOME config instead, its `[auto] auto_approve` list applies; eVi's
#     default pre-approves fs, code, memory, skills and image;
#   - for reviews of untrusted input use `mode: chat`, which has no file, shell
#     or code tools, and put the text in the prompt (`prompt_file`) rather than
#     the workspace;
#   - the backend config (with your API key) is written owner-only under
#     $RUNNER_TEMP rather than the workspace. That keeps it out of artifacts
#     and caches; it does not hide it from file or code tools you approve,
#     which can read any path the runner user can;
#   - the `result` output is model text: read it through `env:` and never paste
#     it into a `run:` or `script:` as an expression.
#
# Outputs besides `result`: `exit_code`, and with `format: json` or
# `stream-json` the run report's `stop_reason` and `session_id`
# (evi_run_outputs.py, which passes only values eVi itself writes). The step
# fails with `evi run`'s exit code (0 done, 1 error, 2 usage, 3 max_turns,
# 4 permission_denied or guardrail, 6 stop_hook_exhausted, 130 interrupted)
# after the outputs are written, so a later step can still read them: give
# this one `continue-on-error: true` and check `outputs.stop_reason`. Read
# them through `env:` too. Tool calls denied in a run the model finished
# (every call, with the config above and no auto_approve) don't fail it:
# that run is done (0), and the json report lists them in `denied_tools`.
#
# Example:
#   - uses: <owner>/evi-ai/.github/actions/evi-run@main
#     id: triage
#     with:
#       prompt: "Summarise the changes in this PR."
#       format: json
#       mode: chat
#       backend: openai_compat
#       base_url: ${{ secrets.LLM_BASE_URL }}
#       api_key: ${{ secrets.LLM_API_KEY }}
#       model: ${{ secrets.LLM_MODEL }}
#       python-version: ${{ matrix.python }}   # optional; default 3.13
#   - env:
#       TRIAGE: ${{ steps.triage.outputs.result }}
#       STOP: ${{ steps.triage.outputs.stop_reason }}
#     run: printf '%s (%s)\n' "$TRIAGE" "$STOP"

inputs:
  prompt:
    description: "The prompt to run. Set this or prompt_file."
    required: false
    default: ""
  prompt_file:
    description: "Read the prompt from this file instead (e.g. instructions plus a PR diff)."
    required: false
    default: ""
  format:
    description: "Output format: text | json | stream-json (the run report, or its events as NDJSON)."
    required: false
    default: "text"
  max_turns:
    description: "Most model round trips the run may take (evi run --max-turns). Blank = eVi's default (12)."
    required: false
    default: ""
  mode:
    description: "Tool preset: chat | cowork | code (blank = default toolset)."
    required: false
    default: ""
  auto_approve:
    description: "true approves every tool call (evi run --yes). false (default): the written config approves no tool, so tool calls are denied. Leave false for untrusted input."
    required: false
    default: "false"
  backend:
    description: "LLM backend: lmstudio | ollama | llamacpp | openai_compat."
    required: false
    default: ""
  base_url:
    description: "OpenAI-compatible base URL (e.g. https://api.openai.com/v1)."
    required: false
    default: ""
  api_key:
    description: "API key for the backend."
    required: false
    default: ""
  model:
    description: "Model id to use."
    required: false
    default: ""
  version:
    description: "evi-assistant version to install (e.g. 1.2.3). Blank = latest."
    required: false
    default: ""
  extras:
    description: "pip extras to install."
    required: false
    default: "web,mcp,web-tools"
  python-version:
    description: "Python for actions/setup-python: 3.12 or newer. Pass your matrix's version to test several."
    required: false
    default: "3.13"

outputs:
  result:
    description: "The stdout of `evi run` (the answer, the JSON report, or the NDJSON events). Untrusted model text."
    value: ${{ steps.run.outputs.result }}
  exit_code:
    description: "`evi run`'s exit code: 0 done, 1 error, 2 usage, 3 max_turns, 4 permission_denied or guardrail, 6 stop_hook_exhausted, 130 interrupted."
    value: ${{ steps.run.outputs.exit_code }}
  stop_reason:
    description: "Why the run stopped, from the run report (format json or stream-json; empty for text)."
    value: ${{ steps.run.outputs.stop_reason }}
  session_id:
    description: "The run's session id, from the run report (format json or stream-json; empty for text)."
    value: ${{ steps.run.outputs.session_id }}

runs:
  using: composite
  steps:
    - uses: actions/setup-python@v7
      with:
        python-version: ${{ inputs.python-version }}

    - name: Install eVi
      shell: bash
      env:
        EVI_VERSION: ${{ inputs.version }}
        EVI_EXTRAS: ${{ inputs.extras }}
      run: |
        python -m pip install --upgrade pip
        # Extras go before the version: `evi-assistant[web]==1.2.3`
        # (`evi-assistant==1.2.3[web]` is not a valid requirement).
        spec="evi-assistant"
        if [ -n "$EVI_EXTRAS" ]; then spec="${spec}[${EVI_EXTRAS}]"; fi
        if [ -n "$EVI_VERSION" ]; then spec="${spec}==${EVI_VERSION}"; fi
        python -m pip install "$spec"

    - name: Configure backend
      id: config
      shell: bash
      env:
        EVI_CFG_BACKEND: ${{ inputs.backend }}
        EVI_CFG_BASE_URL: ${{ inputs.base_url }}
        EVI_CFG_API_KEY: ${{ inputs.api_key }}
        EVI_CFG_MODEL: ${{ inputs.model }}
      # Writes $RUNNER_TEMP/evi-ci/config.toml (owner-only, outside the
      # workspace) only when a backend or base URL was supplied; otherwise the
      # caller's own $EVI_HOME applies. The written config approves no tool
      # category, so tool calls fail closed (evi_run_config.py).
      run: python "$GITHUB_ACTION_PATH/evi_run_config.py" "$RUNNER_TEMP/evi-ci"

    - name: Run prompt
      id: run
      shell: bash
      env:
        EVI_PROMPT: ${{ inputs.prompt }}
        EVI_PROMPT_FILE: ${{ inputs.prompt_file }}
        EVI_FORMAT: ${{ inputs.format }}
        EVI_MAX_TURNS: ${{ inputs.max_turns }}
        EVI_MODE: ${{ inputs.mode }}
        EVI_AUTO_APPROVE: ${{ inputs.auto_approve }}
        EVI_CI_HOME: ${{ steps.config.outputs.home }}
      run: |
        if [ -n "$EVI_CI_HOME" ]; then export EVI_HOME="$EVI_CI_HOME"; fi
        args=(run --format "$EVI_FORMAT")
        case "$EVI_AUTO_APPROVE" in
          true) args+=(--yes) ;;
          false|"") ;;
          *) echo "::error::auto_approve must be true or false"; exit 2 ;;
        esac
        if [ -n "$EVI_MODE" ]; then args+=(--mode "$EVI_MODE"); fi
        if [ -n "$EVI_MAX_TURNS" ]; then args+=(--max-turns "$EVI_MAX_TURNS"); fi
        # The exit code says why the run stopped; it fails the step at the
        # end, once the outputs are written.
        code=0
        if [ -n "$EVI_PROMPT" ] && [ -n "$EVI_PROMPT_FILE" ]; then
          echo "::error::set prompt or prompt_file, not both"; exit 2
        elif [ -n "$EVI_PROMPT_FILE" ]; then
          # No prompt argument: `evi run` reads it from stdin.
          out="$(evi "${args[@]}" < "$EVI_PROMPT_FILE")" || code=$?
        elif [ -n "$EVI_PROMPT" ]; then
          # `--` so a prompt starting with "-" is not read as an option.
          out="$(evi "${args[@]}" -- "$EVI_PROMPT")" || code=$?
        else
          echo "::error::the prompt or prompt_file input is required"; exit 2
        fi
        # Random tokens, so model text can neither issue workflow commands while
        # it is printed nor close the output heredoc early to forge outputs.
        token="$(python -c 'import secrets; print(secrets.token_hex(16))')"
        echo "::stop-commands::stop-$token"
        printf '%s\n' "$out"
        echo "::stop-$token::"
        {
          echo "result<<EVI_EOF_$token"
          printf '%s\n' "$out"
          echo "EVI_EOF_$token"
        } >> "$GITHUB_OUTPUT"
        # exit_code, stop_reason, session_id: only values eVi writes pass.
        printf '%s\n' "$out" | python "$GITHUB_ACTION_PATH/evi_run_outputs.py" "$EVI_FORMAT" "$code"
        exit "$code"
