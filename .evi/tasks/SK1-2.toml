id = "SK1-2"
title = "fs: per-path write lock for write_file/edit_file/apply_patch, plus a parallel checkpoint-seq regression test"
status = "verified"
why = "edit_file reads (evi/tools/fs.py:237, _read_keep_eol), journals (268-272) and writes (274) without a lock. write_file (196-211) and apply_patch (301-341) do the same. The agent runs up to 4 tool bodies at once in a thread pool (evi/llm/agent.py:2976), so two writes to one file can lose an update. Probe on HEAD, with a 0.2 s delay injected in record_before_write: two parallel edit_file calls on 'A\\nB\\n' ('A'->'A1', 'B'->'B1') ended as 'A1\\nB\\n', and B1 was lost. The checkpoint-seq half is ALREADY fixed: evi/checkpoints.py:40-42 defines _LOCK, taken in record_before_write (85-86) and rewind (134-135). No test covers parallel seqs (tests/test_checkpoints.py:66 is sequential), so this task adds one."
hints = "In fs.py add `import os` and `import threading`, plus _PATH_LOCKS: dict[str, threading.Lock] = {} and _PATH_LOCKS_GUARD = threading.Lock(). Then add `def _path_lock(p)` that takes key = os.path.normcase(os.path.abspath(p)) and, under the guard, does a get-or-create of the Lock. In write_file (fs.py:196-211), edit_file (224-276) and apply_patch (301-341), wrap everything after the `p = workdir.resolve(path)` / is_file checks in `with _path_lock(p):`. Returns inside the with block are fine. Do not touch evi/checkpoints.py; its lock already exists. For the tests, monkeypatch.setattr('evi.checkpoints.record_before_write', slow) works because fs imports it inside each call. slow = lambda path, root=None, *, ctx=None: time.sleep(0.2) or 0. Imitate tests/test_checkpoints.py:77-131 (monkeypatch.setattr(config, 'HOME', tmp_path / 'home'); call fs.edit_file(str(p), ...))."
acceptance = ["evi/tools/fs.py has _path_lock(p: Path) -> threading.Lock. It returns the same lock object for the same file (keyed by os.path.normcase(os.path.abspath(p)), so a path that differs only in case shares the lock on Windows) and different locks for different files.", "write_file, edit_file and apply_patch hold _path_lock(p) from their read of the file through the checkpoint, the write and the read-cache pop.", "Lost-update test: with evi.checkpoints.record_before_write monkeypatched to sleep 0.2 s, two threads started together (threading.Barrier(2)) run edit_file 'A'->'A1' and 'B'->'B1' on a file containing 'A\\nB\\n', and the file ends as 'A1\\nB1\\n'. This test fails on the current code.", "The same holds for one edit_file and one apply_patch on the same file: both changes land.", "Seq test: 8 threads each calling fs.write_file on a different file (evi.config.HOME monkeypatched to tmp_path/'home') leave journal entries (checkpoints.list_checkpoints(limit=100, root=tmp_path/'home')) whose seq values are exactly {1..8}. 16 threads calling checkpoints.record_before_write(path, root=...) directly return 16 distinct seqs, {1..16}.", "The existing tests in tests/test_tools.py, tests/test_apply_patch.py and tests/test_checkpoints.py pass."]
files_in_scope = ["evi/tools/fs.py", "tests/test_fs_write_lock.py"]
required_checks = ["python -m pytest -q tests/test_fs_write_lock.py tests/test_tools.py tests/test_apply_patch.py tests/test_checkpoints.py", "python -m ruff check evi/tools/fs.py tests/test_fs_write_lock.py"]
