id = "SK13-3"
title = "backends: vllm_checks, the message naming vLLM's missing tool-calling flags and the warning for a LAN vLLM without an API key"
status = "open"
why = "Part of roadmap item vllm-backend (Phase 2). A vLLM started without --enable-auto-tool-choice --tool-call-parser rejects every agent request with a 400 that eVi shows raw as \"LLM request failed: BadRequestError: Error code: 400 - {...}\", and nothing tells a user that a vLLM on the network with no --api-key serves anyone who can reach it. This task adds the pure functions (independent of SK13-1/SK13-2/SK13-4: it applies to the current base). It has its own loopback test rather than evi.mcp.publish.is_loopback_bind: that import loads the whole evi.mcp package (about 0.45 s cold) and its bind semantics don't treat a client URL's *.localhost as local. The warning judges the URL only; it can't see where vLLM binds (vllm serve without --host listens on every interface), so doctor's check of this machine's LAN address is the director's wiring, as are the calls from the agent loop's request-failed error, the web verify/switch/add endpoints and the CLI."
hints = "Make exactly this one edit and nothing else (the code was run against every acceptance criterion before filing):\n\n1. Create the NEW file evi/backends/vllm_checks.py with exactly this content:\n\n\"\"\"What eVi tells a user about a vLLM server it can't use as it is: one\nstarted without tool calling, and one on the network with no API key.\n\nPure functions; the agent loop, the CLI, the web server and doctor decide\nwhere the messages show.\n\"\"\"\n\nfrom __future__ import annotations\n\nimport ipaddress\nfrom urllib.parse import urlparse\n\n# Keys eVi or the other backends fill in that no real vLLM --api-key is: with\n# one of these, eVi has no key for the server.\nPLACEHOLDER_KEYS = frozenset({\"\", \"none\", \"empty\", \"sk-noauth\", \"lm-studio\", \"ollama\", \"llamacpp\"})\n\n\ndef tool_flags_hint(err: BaseException | str | None) -> str | None:\n    \"\"\"What to do when vLLM refused a request for want of tool calling. vLLM\n    answers a request with tools 400 '\"auto\" tool choice requires\n    --enable-auto-tool-choice and --tool-call-parser to be set' (for a required\n    or named tool_choice: 'requires --tool-call-parser to be set'). The eVi\n    message naming the flags to restart vLLM with, ending with what vLLM said\n    (the error body's message, else the error's text); None for any other\n    error.\"\"\"\n    if err is None:\n        return None\n    body = getattr(err, \"body\", None)\n    said = body.get(\"message\") if isinstance(body, dict) else None\n    if not isinstance(said, str) or not said:\n        said = str(err)\n    if \"--tool-call-parser\" not in said:\n        return None\n    flags = (\"--enable-auto-tool-choice --tool-call-parser <parser>\"\n             if \"--enable-auto-tool-choice\" in said else \"--tool-call-parser <parser>\")\n    return (\"The vLLM server was started without tool calling, which eVi's agent needs: \"\n            f\"restart it with {flags} (the parser for the model's family, e.g. hermes for \"\n            f\"Qwen2.5; vLLM's tool-calling docs list them). vLLM said: {said}\")\n\n\ndef is_loopback_host(host: str) -> bool:\n    \"\"\"Whether a client connecting to `host` stays on this machine: localhost,\n    its subdomains (RFC 6761) and \"localhost.\", and loopback IP literals\n    (127.0.0.0/8, ::1, ::ffff:127.x, with or without brackets). Every other\n    name is False, 0.0.0.0 included (a server bound there is on the network).\"\"\"\n    h = (host or \"\").strip().lower().strip(\"[]\").rstrip(\".\")\n    if h == \"localhost\" or h.endswith(\".localhost\"):\n        return True\n    try:\n        ip = ipaddress.ip_address(h)\n    except ValueError:\n        return False\n    mapped = getattr(ip, \"ipv4_mapped\", None)\n    return ip.is_loopback or bool(mapped is not None and mapped.is_loopback)\n\n\ndef lan_key_warning(base_url: str, api_key: str) -> str | None:\n    \"\"\"A warning when `base_url` is a vLLM server off this machine and eVi has\n    no API key for it (`api_key`, the resolved key, is empty or in\n    PLACEHOLDER_KEYS): vLLM started without --api-key serves anyone who can\n    reach it. None for a loopback host (is_loopback_host), when a key is set,\n    or when `base_url` names no host. It judges the URL only: it can't see\n    where the server binds (`vllm serve` without --host listens on every\n    interface, so a localhost URL doesn't prove the server is off the network).\"\"\"\n    url = (base_url or \"\").strip()\n    host = urlparse(url if \"://\" in url else \"http://\" + url).hostname or \"\"\n    if not host or is_loopback_host(host):\n        return None\n    if (api_key or \"\").strip().lower() not in PLACEHOLDER_KEYS:\n        return None\n    return (f\"The vLLM server at {host} is reachable over the network and eVi has no API key \"\n            \"for it: anyone who can reach it can use the model. Start vLLM with --api-key \"\n            \"<key> and give eVi the same key (an env:VARNAME reference keeps it out of config \"\n            \"files). The key guards only vLLM's /v1 API (/invocations and the other routes at \"\n            \"the server root stay open), so also keep the port off untrusted networks: start \"\n            \"vLLM with --host 127.0.0.1 and reach it through an SSH tunnel, or let only eVi's \"\n            \"machine through a firewall.\")\n\nIt imports only the standard library (ipaddress, urllib.parse); do not import anything from evi into it.\n\nvLLM's exact wording (vllm/renderers/online_renderer.py, v0.32.0): for tool_choice \"auto\" (what a request with tools and no tool_choice becomes) it answers HTTP 400 '\"auto\" tool choice requires --enable-auto-tool-choice and --tool-call-parser to be set'; for \"required\" or a named tool 'tool_choice=\"required\" requires --tool-call-parser to be set'. The OpenAI SDK raises openai.BadRequestError whose .body is the error object ({\"message\": ..., \"type\": \"BadRequestError\", \"param\": None, \"code\": 400}) and whose str() is \"Error code: 400 - {'error': {...}}\". vLLM's --api-key guards only /v1, /v2, /inference and /cohere paths (serve/middleware/authenticate.py); the SageMaker POST /invocations route at the server root is always registered and stays open, hence the warning's advice.\n\nTests go in a NEW file tests/test_vllm_checks.py (do not edit other test files). Build the real SDK error by making a request: openai.OpenAI(base_url=\"http://gpu:8000/v1\", api_key=\"none\", max_retries=0, http_client=httpx.Client(transport=httpx.MockTransport(handler))) where handler returns httpx.Response(400, json={\"error\": {\"message\": AUTO, \"type\": \"BadRequestError\", \"param\": None, \"code\": 400}}), then client.chat.completions.create(model=\"m\", messages=[...], tools=[...]) inside pytest.raises(openai.BadRequestError) and pass caught.value to tool_flags_hint. For the no-body fallback use err = RuntimeError(\"Error code: 400 - \" + AUTO); err.body = {\"type\": \"BadRequestError\"}. Call lan_key_warning(url, key) and is_loopback_host(host) directly with the values of the criteria (pytest.mark.parametrize). For the import criterion parse the module's source with ast (Path(evi.backends.vllm_checks.__file__)) and collect the names of every Import and ImportFrom node. Comments state why in one line."
acceptance = ["tool_flags_hint(the openai.BadRequestError the SDK raises for vLLM's 400 with message '\"auto\" tool choice requires --enable-auto-tool-choice and --tool-call-parser to be set') contains \"restart it with --enable-auto-tool-choice --tool-call-parser <parser>\" and \"hermes\", and ends with \"vLLM said: \" followed by exactly that message (the body's message, not the SDK's \"Error code: 400 - ...\" text).", "tool_flags_hint('tool_choice=\"required\" requires --tool-call-parser to be set') (a str) contains \"restart it with --tool-call-parser <parser>\", does not contain \"--enable-auto-tool-choice\", and ends with \"vLLM said: \" + that string.", "For an error whose .body is a dict without a message (RuntimeError(\"Error code: 400 - \" + AUTO) with body {\"type\": \"BadRequestError\"}), the hint ends with \"vLLM said: Error code: 400 - \" + AUTO (the error's text).", "tool_flags_hint returns None for None, \"\", \"This model's maximum context length is 32768 tokens.\", RuntimeError(\"connection refused\") and an SDK BadRequestError whose message is \"The model `x` does not exist.\".", "lan_key_warning(\"http://192.168.1.20:8000/v1\", key) is a string containing \"192.168.1.20\", \"--api-key\", \"env:\", \"/v1\" and \"--host 127.0.0.1\", and not containing \"[llm]\", for each key in \"\", \"sk-noauth\", \"lm-studio\", \" EMPTY \" and \"None\" (placeholders, compared stripped and lowercased).", "A hostname counts as off this machine: lan_key_warning(\"http://gpu-box:8000/v1\", \"\"), lan_key_warning(\"gpu-box:8000/v1\", \"\") (no scheme) and lan_key_warning(\"http://0.0.0.0:8000/v1\", \"\") are not None.", "lan_key_warning(url, \"\") is None for \"http://localhost:8000/v1\", \"http://127.0.0.1:8000/v1\", \"http://127.0.0.2:8000/v1\", \"http://[::1]:8000/v1\", \"http://[::ffff:127.0.0.1]:8000/v1\", \"http://vllm.localhost:8000/v1\", \"http://localhost.:8000/v1\" and \"\"; lan_key_warning(\"http://192.168.1.20:8000/v1\", \"test-key\") is None.", "is_loopback_host is True for \"localhost\", \"LOCALHOST\", \"vllm.localhost\", \"localhost.\", \"127.0.0.2\", \"::1\", \"[::1]\" and \"::ffff:127.0.0.1\", and False for \"0.0.0.0\", \"192.168.1.20\", \"gpu-box\", \"notlocalhost\", \"localhost.example.com\" and \"\".", "PLACEHOLDER_KEYS == {\"\", \"none\", \"empty\", \"sk-noauth\", \"lm-studio\", \"ollama\", \"llamacpp\"}.", "evi/backends/vllm_checks.py imports exactly __future__, ipaddress and urllib.parse (nothing from evi)."]
