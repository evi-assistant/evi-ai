id = "SK1-12"
title = "fs: _path_lock keys the real path and does not keep a lock per file forever"
status = "open"
why = "SK1-2's per-file lock (evi/tools/fs.py:36-46) keeps one threading.Lock per distinct path in _PATH_LOCKS for the life of the process (the web server's included), and keys it by os.path.normcase(os.path.abspath(p)): two spellings of one file through a symlink or junction get two locks, so their parallel edits can still lose an update. Found by the retro review gate run on SK1-2."
hints = "Key by os.path.normcase(os.path.realpath(p)) instead of abspath (realpath of a file that does not exist yet is fine: it resolves what exists).\nMake _PATH_LOCKS a weakref.WeakValueDictionary[str, threading.Lock]. A threading.Lock can't be weakly referenced, so wrap it: a small class _PathLock with __slots__ = ('lock', '__weakref__'), __enter__/__exit__ delegating to self.lock. _path_lock returns that object; the callers' `with _path_lock(p):` stays as it is. Under _PATH_LOCKS_GUARD, get the existing one or create and store a new one, and return it: the caller's reference keeps it alive while it is held.\nTests go in tests/test_fs_write_lock.py, next to the existing ones; keep those passing."
acceptance = ["Two spellings of one file, one through a symlink (os.symlink; skip with pytest.skip when the platform refuses to create one), get the same lock object from _path_lock.", "After `lock = fs._path_lock(p)` is dropped (del lock; gc.collect()), the key is gone from fs._PATH_LOCKS; while a reference is held it stays and the same object comes back.", "_path_lock(p) still works in `with` and still serialises two threads on one file: the existing lost-update tests in tests/test_fs_write_lock.py pass unchanged.", "The existing tests in tests/test_fs_write_lock.py, tests/test_tools.py, tests/test_apply_patch.py and tests/test_checkpoints.py pass."]
files_in_scope = ["evi/tools/fs.py", "tests/test_fs_write_lock.py"]
required_checks = ["python -m pytest -q tests/test_fs_write_lock.py tests/test_tools.py tests/test_apply_patch.py tests/test_checkpoints.py tests/test_fs_eol.py", "python -m ruff check evi/tools/fs.py tests/test_fs_write_lock.py"]
