id = "SK3-2"
title = "fs: edit_file applies an edit whose only difference is whitespace or indentation, when exactly one place matches"
status = "verified"
why = "Small models often get indentation wrong in old_string (spaces for tabs, the block's own indent dropped, trailing spaces missing), so edit_file misses and the turn is wasted. Second slice of roadmap item loop-tools-edit-recovery (SK3-1 added the miss diagnostics). Applying only on a unique match keeps it from patching the wrong place."
hints = "Add these helpers to evi/tools/fs.py above edit_file, exactly as written (they were prototyped: they re-indent to the file's depth, map spaces to the file's tabs line by line, refuse an ambiguous block, and ignore trailing spaces):\n\ndef _indent(line: str) -> str:\n    return line[: len(line) - len(line.lstrip())]\n\n\ndef _loose_matches(lines: list[str], old_lines: list[str]) -> list[int]:\n    \"\"\"Start indexes of every window of `lines` equal to `old_lines` with each\n    line stripped of surrounding whitespace.\"\"\"\n    want = [ln.strip() for ln in old_lines]\n    k = len(want)\n    return [i for i in range(len(lines) - k + 1)\n            if [ln.strip() for ln in lines[i:i + k]] == want]\n\n\ndef _reindent(new_lines: list[str], old_lines: list[str], file_lines: list[str]) -> list[str]:\n    \"\"\"`new_lines` indented the way the file indents what old_string matched:\n    a line where new_string keeps old_string's indent takes the file's indent\n    for that line; otherwise an indent old_string used maps to the file's\n    indent on its first such line, and any other indent has old_string's\n    first indent swapped for the file's.\"\"\"\n    pairs = [(o, f) for o, f in zip(old_lines, file_lines) if o.strip() and f.strip()]\n    mapping: dict[str, str] = {}\n    for o, f in pairs:\n        mapping.setdefault(_indent(o), _indent(f))\n    old_pre, file_pre = (_indent(pairs[0][0]), _indent(pairs[0][1])) if pairs else (\"\", \"\")\n    out = []\n    for j, ln in enumerate(new_lines):\n        ind = _indent(ln)\n        if not ln.strip():\n            out.append(ln)\n        elif (j < len(old_lines) and j < len(file_lines) and old_lines[j].strip()\n              and file_lines[j].strip() and _indent(old_lines[j]) == ind):\n            out.append(_indent(file_lines[j]) + ln[len(ind):])\n        elif ind in mapping:\n            out.append(mapping[ind] + ln[len(ind):])\n        elif ln.startswith(old_pre):\n            out.append(file_pre + ln[len(old_pre):])\n        else:\n            out.append(ln)\n    return out\nAlso add this helper, exactly as written, below _reindent:\n\ndef _loose_block(text: str, old: str, new: str, eol: str) -> tuple[str, str, str] | None:\n    \"\"\"When `old` matches exactly one block of `text` line by line, ignoring\n    each line's surrounding whitespace: (that block as the file has it, `new`\n    re-indented the way the file indents it, a note for the message); else None.\"\"\"\n    lines, old_lines = text.split(eol), old.split(eol)\n    if not any(ln.strip() for ln in old_lines):\n        return None\n    hits = _loose_matches(lines, old_lines)\n    if len(hits) != 1:\n        return None\n    i, k = hits[0], len(old_lines)\n    block = lines[i:i + k]\n    replacement = eol.join(_reindent(new.split(eol), old_lines, block))\n    return eol.join(block), replacement, f\", matched ignoring whitespace at lines {i + 1}-{i + k}\"\n\nThen change edit_file in only three places and leave everything else in it as it is: (1) just before `if old_n in text:` add `note = \"\"`; (2) at the start of the final `else:` branch (where neither old_n nor old_string is in text) add `loose = None if replace_all else _loose_block(text, old_n, new_n, eol)` and `if loose is not None: target_old, target_new, note = loose`, and put that branch's existing code (the already-applied check and the not-found error) under the `else:` of that `if`, unchanged; (3) in the final success message insert {note} right after the replacement count, so it reads f\"edited {p}: {count if replace_all else 1} replacement(s){note}{_post_write(p)}\". A loose match then goes through the same count, checkpoint and write as an exact one. Do not restructure edit_file in any other way.\nTwo or more loose matches, or none, make _loose_block return None, so the existing already-applied check and the not-found error with the closest region (SK3-1) run unchanged.\nTests in tests/test_edit_recovery.py next to the SK3-1 tests (files with write_bytes, assertions on read_bytes)."
acceptance = ["File b'def f():\\n    if x:\\n        return 1\\n    return 0\\n': edit_file old 'if x:\\n    return 1' (indent dropped) new 'if x:\\n    return 2' leaves b'def f():\\n    if x:\\n        return 2\\n    return 0\\n', and the message says 'matched ignoring whitespace at lines 2-3'.", "File b'def f():\\n\\tif x:\\n\\t\\treturn 1\\n' (tabs): old '    if x:\\n        return 1' new '    if x:\\n        return 3' leaves b'def f():\\n\\tif x:\\n\\t\\treturn 3\\n'.", "A flattened block: file b'def f():\\n    if x:\\n        return 1\\n', old 'if x:\\nreturn 1' new 'if x:\\nreturn 2' leaves b'def f():\\n    if x:\\n        return 2\\n'.", "File b'a = 1   \\nb = 2\\n' (trailing spaces): old 'a = 1\\nb = 2' new 'a = 10\\nb = 2' leaves b'a = 10\\nb = 2\\n'.", "File b'a:\\n    x = 1\\nb:\\n    x = 1\\n': old 'x = 1\\t' (a trailing tab, so it occurs nowhere exactly) new 'x = 2' matches two blocks loosely, so nothing changes and the not-found error is returned.", "A CRLF file keeps CRLF after a loose match.", "The existing tests in tests/test_edit_recovery.py, tests/test_tools.py, tests/test_fs_eol.py, tests/test_fs_write_lock.py and tests/test_checkpoints.py pass."]
