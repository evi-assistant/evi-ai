id = "SK3-2"
title = "fs: edit_file applies an edit whose only difference is whitespace or indentation, when exactly one place matches"
status = "open"
why = "Small models often get indentation wrong in old_string (spaces for tabs, the block's own indent dropped, trailing spaces missing), so edit_file misses and the turn is wasted. Second slice of roadmap item loop-tools-edit-recovery (SK3-1 added the miss diagnostics). Applying only on a unique match keeps it from patching the wrong place."
hints = "Add these helpers to evi/tools/fs.py above edit_file, exactly as written (they were prototyped: they re-indent to the file's depth, map spaces to the file's tabs line by line, refuse an ambiguous block, and ignore trailing spaces):\n\ndef _indent(line: str) -> str:\n    return line[: len(line) - len(line.lstrip())]\n\n\ndef _loose_matches(lines: list[str], old_lines: list[str]) -> list[int]:\n    \"\"\"Start indexes of every window of `lines` equal to `old_lines` with each\n    line stripped of surrounding whitespace.\"\"\"\n    want = [ln.strip() for ln in old_lines]\n    k = len(want)\n    return [i for i in range(len(lines) - k + 1)\n            if [ln.strip() for ln in lines[i:i + k]] == want]\n\n\ndef _reindent(new_lines: list[str], old_lines: list[str], file_lines: list[str]) -> list[str]:\n    \"\"\"`new_lines` indented the way the file indents what old_string matched:\n    a line where new_string keeps old_string's indent takes the file's indent\n    for that line; otherwise an indent old_string used maps to the file's\n    indent on its first such line, and any other indent has old_string's\n    first indent swapped for the file's.\"\"\"\n    pairs = [(o, f) for o, f in zip(old_lines, file_lines) if o.strip() and f.strip()]\n    mapping: dict[str, str] = {}\n    for o, f in pairs:\n        mapping.setdefault(_indent(o), _indent(f))\n    old_pre, file_pre = (_indent(pairs[0][0]), _indent(pairs[0][1])) if pairs else (\"\", \"\")\n    out = []\n    for j, ln in enumerate(new_lines):\n        ind = _indent(ln)\n        if not ln.strip():\n            out.append(ln)\n        elif (j < len(old_lines) and j < len(file_lines) and old_lines[j].strip()\n              and file_lines[j].strip() and _indent(old_lines[j]) == ind):\n            out.append(_indent(file_lines[j]) + ln[len(ind):])\n        elif ind in mapping:\n            out.append(mapping[ind] + ln[len(ind):])\n        elif ln.startswith(old_pre):\n            out.append(file_pre + ln[len(old_pre):])\n        else:\n            out.append(ln)\n    return out\nIn edit_file, in the branch where neither old_n nor old_string is in text, BEFORE the already-applied check: unless replace_all is set, split text and old_n on the file's line ending (eol from _eol_of), and when old_n has at least one non-blank line and _loose_matches gives exactly one window i, build new_text = eol.join(lines[:i] + _reindent(new_n.split(eol), old_lines, lines[i:i + k]) + lines[i + k:]). That edit then goes through the same checkpoint (record_before_write) and write as an exact one; its success message is f\"edited {p}: 1 replacement(s), matched ignoring whitespace at lines {i + 1}-{i + k}\" followed by _post_write(p), as the normal message ends. Restructure the branch so both paths share the checkpoint and write code (for example compute new_text and a message suffix, then fall through).\nTwo or more loose matches, or none, go on to the existing already-applied check and the not-found error with the closest region (SK3-1), unchanged.\nTests in tests/test_edit_recovery.py next to the SK3-1 tests (files with write_bytes, assertions on read_bytes)."
acceptance = ["File b'def f():\\n    if x:\\n        return 1\\n    return 0\\n': edit_file old 'if x:\\n    return 1' (indent dropped) new 'if x:\\n    return 2' leaves b'def f():\\n    if x:\\n        return 2\\n    return 0\\n', and the message says 'matched ignoring whitespace at lines 2-3'.", "File b'def f():\\n\\tif x:\\n\\t\\treturn 1\\n' (tabs): old '    if x:\\n        return 1' new '    if x:\\n        return 3' leaves b'def f():\\n\\tif x:\\n\\t\\treturn 3\\n'.", "A flattened block: file b'def f():\\n    if x:\\n        return 1\\n', old 'if x:\\nreturn 1' new 'if x:\\nreturn 2' leaves b'def f():\\n    if x:\\n        return 2\\n'.", "File b'a = 1   \\nb = 2\\n' (trailing spaces): old 'a = 1\\nb = 2' new 'a = 10\\nb = 2' leaves b'a = 10\\nb = 2\\n'.", "File b'a:\\n    x = 1\\nb:\\n    x = 1\\n': old '  x = 1' new '  x = 2' (two loose matches) changes nothing and returns the not-found error.", "A CRLF file keeps CRLF after a loose match.", "The existing tests in tests/test_edit_recovery.py, tests/test_tools.py, tests/test_fs_eol.py, tests/test_fs_write_lock.py and tests/test_checkpoints.py pass."]
