id = "SK11-1"
title = "context_report: the system prompt's tokens per part (memory, skills, project, ...)"
status = "verified"
why = "Last part of roadmap item models-ops-context-window-probe. /context shows the system prompt as one bucket, so a user can't tell whether memory, skills or the project's EVI.md is filling a small window. This task adds a pure function that splits the system bucket by the prompt's labelled parts; the agent handing it the parts and the CLI/web display are the director's wiring."
hints = "Make exactly these three edits to evi/context_report.py and nothing else (the code was run against every acceptance criterion before filing):\n\n1. Insert this function directly above `def context_breakdown(`, with two blank lines before and after it:\n\ndef system_prompt_tokens(\n    history: list[dict[str, Any]], parts: Iterable[tuple[str, str]]\n) -> dict[str, int]:\n    \"\"\"Estimated tokens of the system messages in `history`, per part of the\n    prompt: `parts` is (label, text) in the order the agent joined them with\n    blank lines. A part counts where it is found in the first system message\n    (with the blank line after it); what no part accounts for (a part changed\n    since the prompt was sent, a later system message) is \"other\". Largest\n    first; the same ~4 chars/token estimate as the buckets.\"\"\"\n    system = [m for m in history if m.get(\"role\") == \"system\"]\n    total = sum(_text_chars(m) for m in system)\n    first = system[0].get(\"content\") if system else None\n    first = first if isinstance(first, str) else \"\"\n    chars: dict[str, int] = {}\n    pos = 0\n    for label, text in parts:\n        at = first.find(text, pos) if text else -1\n        if at < 0:\n            continue  # empty, or not in the prompt as sent\n        end = at + len(text)\n        if first.startswith(\"\\n\\n\", end):\n            end += 2  # the separator after it\n        chars[label] = chars.get(label, 0) + (end - at)\n        pos = end\n    other = total - sum(chars.values())\n    if other > 0:\n        chars[\"other\"] = chars.get(\"other\", 0) + other\n    return dict(sorted(((g, c // 4) for g, c in chars.items()), key=lambda kv: (-kv[1], kv[0])))\n\n2. Change context_breakdown's signature to:\n\ndef context_breakdown(\n    history: list[dict[str, Any]], ceiling: int, tools: Iterable[Any] = (),\n    system_parts: Iterable[tuple[str, str]] = (),\n) -> dict[str, Any]:\n\nand in its docstring replace \"`messages`, `schema_groups`, and per-bucket\" with \"`messages`, `schema_groups`, `system_groups` (the system bucket per part of `system_parts`, see system_prompt_tokens), and per-bucket\" (re-wrap the lines at 79 columns).\n\n3. In the dict context_breakdown returns, add this line right after the \"schema_groups\" line:\n\n        \"system_groups\": system_prompt_tokens(history, system_parts) if system_parts else {},\n\nTests go in a NEW file tests/test_context_system_parts.py (do not edit tests/test_context_report.py). Build each prompt the way the agent does, \"\\n\\n\".join(text for _, text in parts), and call system_prompt_tokens / context_breakdown directly; assert exact dicts. Comments state why in one line."
acceptance = ["parts = [('base', 'a'*40), ('date', 'b'*20), ('project', '')] joined with blank lines as the only system message: system_prompt_tokens gives exactly {'base': 10, 'date': 5} (each part with its following blank line; an empty part is skipped; no 'other').", "With the same prompt but parts [('base', 'a'*40), ('date', 'c'*20)] (date changed since the prompt was sent), the result is {'base': 10, 'other': 5}.", "A second system message of 80 chars after that prompt adds 'other': 20, and the result's keys are ordered largest first: ['other', 'base', 'date'].", "A label used twice sums: content 'm'*8 + '\\n\\n' + 'n'*8 + '\\n\\n' + 'm'*8 with parts [('mem','m'*8), ('n','n'*8), ('mem','m'*8)] gives {'mem': 4, 'n': 2}.", "Two parts with the same text are found at successive positions, not twice at the first: content 'same\\n\\nsame' with parts [('a','same'), ('b','same')] gives {'a': 1, 'b': 1}.", "A history with no system message gives {}.", "context_breakdown(history, 1000, system_parts=parts) has 'system_groups' equal to system_prompt_tokens(history, parts); without system_parts it is {}; every existing key and value of context_breakdown is unchanged.", "The existing tests in tests/test_context_report.py pass unchanged."]
files_in_scope = ["evi/context_report.py", "tests/test_context_system_parts.py"]
required_checks = ["python -m pytest -q tests/test_context_system_parts.py tests/test_context_report.py", "python -m ruff check evi/context_report.py tests/test_context_system_parts.py"]
