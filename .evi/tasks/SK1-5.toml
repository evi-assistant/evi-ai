id = "SK1-5"
title = "portprobe: llama.cpp discovery also probes 9931 (llama-server's new default port)"
status = "open"
why = "There is no 9931 anywhere in evi/ (grep). llama-server's default port moved from 8080 to 9931 (llama.cpp b11521), and the official Llama tray app listens on 9931 (roadmap research, group-models-ops). Zero-config detection: /api/backend/status probes _KNOWN_BACKENDS (evi/apps/web/server.py:269-273) through _probe_candidate (server.py:872-888). For llamacpp, that calls portprobe.discover_llamacpp_url, which scans only port..port+10 (evi/portprobe.py:155-181). LlamaCppBackend._effective_base_url uses the same function (evi/backends/llamacpp.py:37-55). Fixing discover_llamacpp_url covers both without touching server.py. Probe on HEAD: 9931 is never probed."
hints = "portprobe.py:21-23 holds the constants; change discover_llamacpp_url at 155-181. Make it: ports = [start + i for i in range(span + 1)], then ports += [p for p in extra_ports if p not in ports]. Keep the rest: the concurrent port_open pass, then the HTTP pass in `ports` order (do not sort). Add the new tests next to the existing discover tests in tests/test_portprobe.py (105-138), stubbing exactly as they do: monkeypatch.setattr(pp, 'port_open', lambda host, port: ...) and monkeypatch.setattr(pp, 'is_openai_server', lambda url, **k: ...). Do not edit apps/web/server.py, backends/*.py or the default URLs."
acceptance = ["evi/portprobe.py defines LLAMACPP_EXTRA_PORTS = (9931,) with a comment saying why (llama-server's default moved from 8080 to 9931, and the Llama app listens there).", "discover_llamacpp_url(base_url, *, span=LLAMACPP_PORT_SPAN, api_key=None, extra_ports=LLAMACPP_EXTRA_PORTS) probes port..port+span, then each extra port not already in that range, on the same host. For 'http://localhost:8080/v1' the probed ports are 8080..8090 plus 9931.", "When only 9931 answers like an OpenAI server, it returns 'http://127.0.0.1:9931/v1'. When 8081 and 9931 both do, 8081 wins (the configured span comes first).", "A base_url already on port 9931 probes 9931 exactly once.", "extra_ports=() probes only the span (the old behaviour).", "The module and function docstrings mention 9931. The existing tests/test_portprobe.py passes with test_discover_scans_span_ports updated to expect 9931 too, and tests/test_backends.py and tests/test_backend_status.py pass."]
files_in_scope = ["evi/portprobe.py", "tests/test_portprobe.py"]
required_checks = ["python -m pytest -q tests/test_portprobe.py tests/test_backends.py tests/test_backend_status.py", "python -m ruff check evi/portprobe.py tests/test_portprobe.py"]
