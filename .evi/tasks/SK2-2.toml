id = "SK2-2"
title = "users: `web-config users add` refuses a login that would share another's data folder; doctor flags existing ones"
status = "open"
why = "In multi-user web mode each login's data lives in HOME/users/<slug>, where the slug is evi/apps/web/server.py _safe_user(name) case-folded (_login_dir_key, around line 1036): 'bob smith', 'bob_smith' and 'bob/smith' are all users/bob_smith. The server refuses every login of such a collision (_colliding_logins, _authenticate_login), so they would not read each other's data, but nothing stops one being created: evi/users.py add_user (around line 62) only replaces a login with the same name ignoring case, so `evi web-config users add \"bob smith\"` next to bob_smith succeeds silently and then neither can sign in. `evi doctor` (evi/doctor.py _check_web_access, around line 430) flags only owner-reserved names, not collisions."
hints = "evi/users.py: add `def login_dir_key(name: str) -> str` returning the same value as the server's _login_dir_key: `(re.sub(r\"[^A-Za-z0-9_.-]\", \"_\", name.strip()).strip(\"._-\") or \"user\").casefold()` (a restatement, like doctor's _owner_named restates _reserved_login; don't import the web server here). Add `def colliding_logins(users) -> dict[str, list[str]]` with the same result as server._colliding_logins (copy its logic, using login_dir_key).\nadd_user: after stripping the name, if some existing login has a different name (compare with .lower(), as add_user already does for re-issue) but the same login_dir_key, raise ValueError(f\"{name!r} would share the data folder users/... with the login {other!r}: choose another name\"). `evi web-config users add` already prints a ValueError and exits 1 (evi/apps/cli/main.py web_users_add), so the CLI needs no change.\nevi/doctor.py _check_web_access: inside `if cfg.web.multi_user:` after the owner-reserved check, compute collisions with users.colliding_logins(users); when there are any, append Check(\"multi-user logins\", \"warn\", detail naming each group and saying none of them can sign in until all but one are renamed, fix=tuple of 'evi web-config users remove \"<name>\"' for each colliding login).\nTests in a new tests/test_users_collisions.py. For doctor, copy the doctor_home fixture and _web_checks helper pattern from tests/test_web_hardening.py (around lines 1025-1045: monkeypatch evi.config HOME/CONFIG_PATH, evi.users.USERS_PATH, delenv EVI_WEB_AUTH_TOKEN, chdir)."
acceptance = ["users.login_dir_key equals evi.apps.web.server._login_dir_key for each of: 'bob smith', 'bob_smith', 'bob/smith', 'Alice', 'alice', '..', 'owner.', ' x '.", "add_user('bob_smith') then add_user('bob smith') raises ValueError naming 'bob_smith', and users.json still holds only bob_smith; add_user('BOB_SMITH') after bob_smith re-issues (same name ignoring case), as before; add_user('alice') next to bob_smith works.", "colliding_logins on [bob smith, bob_smith, alice] gives {'bob smith': ['bob_smith'], 'bob_smith': ['bob smith']}, the same as server._colliding_logins.", "With [web] multi_user = true and auth_token set, a users.json holding 'bob smith' and 'bob_smith' (written directly) makes doctor's _check_web_access return a 'multi-user logins' warn whose fix removes each; with no collision there is no such check.", "The existing tests in tests/test_users.py and tests/test_web_hardening.py pass."]
files_in_scope = ["evi/users.py", "evi/doctor.py", "tests/test_users_collisions.py"]
required_checks = ["python -m pytest -q tests/test_users_collisions.py tests/test_users.py tests/test_web_hardening.py", "python -m ruff check evi/users.py evi/doctor.py tests/test_users_collisions.py"]
