id = "SK6-1"
title = "context report: count the tool schemas sent with every request, per category and per MCP server"
status = "verified"
why = "Part of roadmap item models-ops-context-window-probe (the per-component breakdown). /context and the web usage popover split the conversation into system/user/assistant/tools, but the tool schemas that go with EVERY request are not counted at all; with a few MCP servers they are thousands of tokens, the first thing to trim on a small window. This task adds the count to evi/context_report.py; showing it in the CLI and web is SK6-2."
hints = "All in evi/context_report.py (read it first; it is short):\n1) The imports become `import json` and `from typing import Any, Iterable`, and BUCKETS becomes (\"system\", \"schemas\", \"user\", \"assistant\", \"tools\") with this comment above it: `# Display order of the buckets. \"schemas\" is the tool schemas that go with` / `# every request (counted when context_breakdown is given the tools).`\n2) Add this function directly above context_breakdown:\n\ndef tool_schema_tokens(tools: Iterable[Any]) -> dict[str, int]:\n    \"\"\"Estimated tokens of the tool schemas that go with every request, per\n    group: a built-in tool's category (\"fs\", \"code\", ...), or \"mcp:<server>\"\n    for an MCP tool (named \"<server>.<tool>\"). Largest group first; the same\n    ~4 chars/token estimate as the buckets.\"\"\"\n    chars: dict[str, int] = {}\n    for tool in tools:\n        try:\n            size = len(json.dumps(tool.openai_schema(), ensure_ascii=False))\n        except (AttributeError, TypeError, ValueError):\n            continue  # not a tool, or a schema that can't be sent anyway\n        name = str(getattr(tool, \"name\", \"\"))\n        category = str(getattr(tool, \"category\", \"\") or \"other\")\n        group = f\"mcp:{name.split('.', 1)[0]}\" if category == \"mcp\" and \".\" in name else category\n        chars[group] = chars.get(group, 0) + size\n    return dict(sorted(((g, c // 4) for g, c in chars.items()), key=lambda kv: (-kv[1], kv[0])))\n\n3) context_breakdown gets a third parameter, `tools: Iterable[Any] = ()`, and its docstring says the schemas of `tools` (the session's tools) go into the schemas bucket and that the result also has `schema_groups`. Right after the line `buckets = {b: chars[b] // 4 for b in BUCKETS}` add\n    schema_groups = tool_schema_tokens(tools)\n    buckets[\"schemas\"] = sum(schema_groups.values())\nand add `\"schema_groups\": schema_groups,` as the last entry of the returned dict. Change nothing else.\n4) Tests: ADD to tests/test_context_report.py (read it, then edit_file or apply_patch; keep every existing test). Use real tools (`import evi.tools.fs  # noqa: F401  registers read_file and write_file`, then `from evi.tools.base import REGISTRY, Tool`) and build MCP-like tools as Tool(name=\"github.search\", description=\"d\" * 400, parameters={\"type\": \"object\", \"properties\": {}}, func=lambda **k: \"\", category=\"mcp\"). Comments state why in one line."
acceptance = ["tool_schema_tokens([REGISTRY['read_file'], REGISTRY['write_file']]) == {'fs': (len(json.dumps(rf.openai_schema())) + len(json.dumps(wf.openai_schema()))) // 4} for those two tools.", "MCP tools named 'github.search', 'github.issue' and 'notes.add' are grouped as 'mcp:github' and 'mcp:notes'; the groups come largest first.", "Something that isn't a tool (e.g. object()) in the list is skipped, not an error.", "context_breakdown(history, 1000, tools=[REGISTRY['read_file']]) has buckets['schemas'] == sum(schema_groups.values()) > 0, and 'used' includes it; without tools, buckets['schemas'] == 0, schema_groups == {} and 'used' is as before.", "BUCKETS == ('system', 'schemas', 'user', 'assistant', 'tools'), and the existing tests in tests/test_context_report.py and tests/test_context_window.py pass."]
