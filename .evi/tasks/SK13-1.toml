id = "SK13-1"
title = "backends: VLLMBackend, the window from /v1/models max_model_len, models and LoRA adapters"
status = "open"
why = "Part of roadmap item vllm-backend (Phase 2). vLLM is only reachable today as the generic openai_compat kind, which reports no context window (so with no [llm] context_size eVi has no window at all, and a configured one stands even when vLLM runs with a smaller --max-model-len) and lists LoRA adapters as if they were models. This task adds the backend class (and a parent field on ModelInfo for adapters). Registering the \"vllm\" kind is SK13-2 and vLLM's /health and /version are SK13-4 (both apply on top of this task); the agent, CLI, web, setup and doctor surfaces are the director's wiring."
hints = "Make exactly these two edits and nothing else (the code was run against every acceptance criterion before filing):\n\n1. In evi/backends/base.py, in the ModelInfo dataclass, directly after the line `    loaded: bool = False`, add this one line (the rest of base.py stays exactly as it is):\n\n    parent: str | None = None        # a LoRA adapter's base model id (vLLM)\n\n2. Create the NEW file evi/backends/vllm.py with exactly this content:\n\n\"\"\"vLLM backend: OpenAI-compatible at /v1, plus what vLLM reports of itself.\n\nvLLM's /v1/models lists the served model with the window it runs with\n(max_model_len) and the path it was loaded from (root), and each LoRA adapter\nas its own entry whose parent is the base model (an adapter's entry has no\nmax_model_len). vLLM does not report a quantization; list_models infers one\nfrom the served name or path.\n\"\"\"\n\nfrom __future__ import annotations\n\nimport re\nfrom typing import Any\n\nfrom evi.backends.base import ModelInfo, window_tokens\nfrom evi.backends.openai_compat import OpenAICompatBackend\n\n# A quantization a model id or path names, as a whole word: (word, label),\n# the first found wins (so \"GPTQ-Int4\" is GPTQ).\n_QUANT_WORDS: tuple[tuple[str, str], ...] = (\n    (\"awq\", \"AWQ\"),\n    (\"gptq\", \"GPTQ\"),\n    (\"nvfp4\", \"NVFP4\"),\n    (\"mxfp4\", \"MXFP4\"),\n    (\"fp8\", \"FP8\"),\n    (\"w4a16\", \"W4A16\"),\n    (\"w8a8\", \"W8A8\"),\n    (\"int4\", \"INT4\"),\n    (\"int8\", \"INT8\"),\n    (\"bnb\", \"bitsandbytes\"),\n    (\"gguf\", \"GGUF\"),\n)\n\n\ndef infer_quantization(*names: str) -> str | None:\n    \"\"\"The quantization a model id or path names (vLLM doesn't report one):\n    the label of the first word of _QUANT_WORDS found, as a whole word, in the\n    first of `names` that has one, e.g. \"Qwen/Qwen2.5-Coder-14B-Instruct-AWQ\"\n    -> \"AWQ\"; None when none does.\"\"\"\n    for name in names:\n        words = set(re.split(r\"[^a-z0-9]+\", (name or \"\").lower()))\n        for word, label in _QUANT_WORDS:\n            if word in words:\n                return label\n    return None\n\n\ndef _base_card(card: dict[str, Any], by_id: dict[str, dict[str, Any]]) -> dict[str, Any] | None:\n    \"\"\"The base model entry of `card`: itself when it has no parent; for a\n    LoRA adapter its parent's entry, or, when the parent is not a listed id\n    (vLLM's --lora-modules base_model_name may be a path), the only entry\n    without a parent; None when there is no single one.\"\"\"\n    parent = card.get(\"parent\")\n    if not (isinstance(parent, str) and parent):\n        return card\n    if parent in by_id:\n        return by_id[parent]\n    bases = [c for c in by_id.values() if not c.get(\"parent\")]\n    return bases[0] if len(bases) == 1 else None\n\n\nclass VLLMBackend(OpenAICompatBackend):\n    name = \"vllm\"\n\n    def __init__(\n        self,\n        base_url: str = \"http://localhost:8000/v1\",\n        api_key: str = \"\",\n        request_timeout: float = 120.0,\n    ) -> None:\n        super().__init__(base_url=base_url, api_key=api_key, request_timeout=request_timeout)\n\n    def _get(self, url: str):\n        \"\"\"GET `url` with the API key when there is one (fast_get: None when\n        the server doesn't answer).\"\"\"\n        from evi.portprobe import fast_get\n\n        headers = {\"Authorization\": f\"Bearer {self.api_key}\"} if self.api_key else None\n        return fast_get(url, headers=headers)\n\n    def _cards(self) -> list[dict[str, Any]]:\n        \"\"\"The entries of /v1/models that have an id; [] when the server\n        doesn't answer or answers with something else.\"\"\"\n        r = self._get(self.base_url.rstrip(\"/\") + \"/models\")\n        if r is None or r.status_code != 200:\n            return []\n        try:\n            data = r.json()\n        except ValueError:\n            return []\n        items = data.get(\"data\") if isinstance(data, dict) else None\n        if not isinstance(items, list):\n            return []\n        return [c for c in items\n                if isinstance(c, dict) and isinstance(c.get(\"id\"), str) and c[\"id\"]]\n\n    def list_models(self) -> list[ModelInfo]:\n        \"\"\"The served models and LoRA adapters, in /v1/models order. An\n        adapter's parent is the base model vLLM names; the quantization is\n        inferred from the id, else the root path (an adapter's from its base\n        model's entry, see _base_card).\"\"\"\n        cards = self._cards()\n        by_id = {c[\"id\"]: c for c in cards}\n        out: list[ModelInfo] = []\n        for card in cards:\n            parent = card.get(\"parent\")\n            parent = parent if isinstance(parent, str) and parent else None\n            base = _base_card(card, by_id) or {}\n            quant = infer_quantization(str(base.get(\"id\") or \"\"), str(base.get(\"root\") or \"\"))\n            out.append(ModelInfo(id=card[\"id\"], backend=self.name, quantization=quant,\n                                 loaded=True, parent=parent))\n        return out\n\n    def context_window(self, model_id: str) -> int | None:\n        \"\"\"The window vLLM serves `model_id` with: its /v1/models entry's\n        max_model_len, or for a LoRA adapter (whose entry has none) its base\n        model's (see _base_card). None when the server doesn't answer, doesn't\n        list it, or the adapter's base model can't be told.\"\"\"\n        by_id = {c[\"id\"]: c for c in self._cards()}\n        card = by_id.get(model_id)\n        if card is None:\n            return None\n        window = window_tokens(card.get(\"max_model_len\"))\n        base = _base_card(card, by_id)\n        if window is None and base is not None and base is not card:\n            window = window_tokens(base.get(\"max_model_len\"))\n        return window\n\nDo not register the backend in evi/backends/factory.py or evi/backends/__init__.py (that is task SK13-2), and do not add health or version methods (task SK13-4).\n\nFacts the code relies on (vLLM v0.32.0 source): /v1/models is {\"object\": \"list\", \"data\": [ModelCard]} where a ModelCard has id, object \"model\", created, owned_by \"vllm\", root (the path the model was loaded from), parent (None for a base model; for a LoRA adapter the --lora-modules base_model_name if one was given, which may be a path rather than a served id, else the first base model's id) and max_model_len (set on base models only; None on adapters). --api-key guards /v1, so the key goes with /v1/models.\n\nTests go in a NEW file tests/test_vllm_backend.py (do not edit other test files). Fake vLLM over HTTP the way tests/test_context_window_probe.py does: `from tests.test_backends import _patch_httpx`, with a handler that answers by req.url.path from a dict of httpx.Response and 404 otherwise, appending each request to a list so the test can assert the full URLs and the Authorization header. Use host \"h\" (http://h:8000/v1): a non-loopback host skips fast_get's port pre-probe, so the fake answers. For an unreachable server use monkeypatch.setattr(evi.portprobe, \"fast_get\", lambda *a, **k: None). Serve \"/v1/models\" -> httpx.Response(200, json={\"object\": \"list\", \"data\": [...]}) with entries shaped like vLLM's: BASE = {\"id\": \"qwen2.5-coder:14b\", \"object\": \"model\", \"owned_by\": \"vllm\", \"root\": \"Qwen/Qwen2.5-Coder-14B-Instruct-AWQ\", \"parent\": None, \"max_model_len\": 32768}, ADAPTER = {\"id\": \"sql-lora\", \"object\": \"model\", \"owned_by\": \"vllm\", \"root\": \"/loras/sql\", \"parent\": \"qwen2.5-coder:14b\", \"max_model_len\": None} and OTHER = {\"id\": \"llama-3-8b\", \"object\": \"model\", \"owned_by\": \"vllm\", \"root\": \"meta-llama/Meta-Llama-3-8B-Instruct\", \"parent\": None, \"max_model_len\": 8192}. Call VLLMBackend(\"http://h:8000/v1\").list_models() / .context_window(...) and infer_quantization(...) directly and assert exact values (compare list_models() to a list of ModelInfo objects; use pytest.mark.parametrize for the bad answers and the quantization names). Comments state why in one line."
acceptance = ["ModelInfo has a field parent: str | None defaulting to None, declared after loaded; every other ModelInfo field and window_tokens are unchanged.", "VLLMBackend() is an OpenAICompatBackend with name \"vllm\", base_url \"http://localhost:8000/v1\" and api_key \"\", and VLLMBackend().make_client().api_key == \"none\".", "Against /v1/models data [BASE, ADAPTER], VLLMBackend(\"http://h:8000/v1\").list_models() == [ModelInfo(id=\"qwen2.5-coder:14b\", backend=\"vllm\", quantization=\"AWQ\", loaded=True, parent=None), ModelInfo(id=\"sql-lora\", backend=\"vllm\", quantization=\"AWQ\", loaded=True, parent=\"qwen2.5-coder:14b\")] (the adapter has its base model's quantization).", "Against the same data, context_window(\"qwen2.5-coder:14b\") == 32768, context_window(\"sql-lora\") == 32768 (an adapter's entry has no max_model_len, so its base model's), and context_window(\"other\") is None.", "An adapter whose parent is not a listed id: against [BASE, ADAPTER with parent \"Qwen/Qwen2.5-Coder-14B-Instruct-AWQ\"], context_window(\"sql-lora\") == 32768 and list_models()[1] == ModelInfo(id=\"sql-lora\", backend=\"vllm\", quantization=\"AWQ\", loaded=True, parent=\"Qwen/Qwen2.5-Coder-14B-Instruct-AWQ\") (the only base entry stands in); against [BASE, OTHER, that adapter], context_window(\"sql-lora\") is None and list_models()[2].quantization is None.", "With api_key \"test-key\", list_models() and context_window(\"qwen2.5-coder:14b\") each send one GET to exactly http://h:8000/v1/models with header Authorization: Bearer test-key; with api_key \"\" the request has no Authorization header.", "With evi.portprobe.fast_get returning None: list_models() == [] and context_window(\"qwen2.5-coder:14b\") is None.", "For a /v1/models answer of non-JSON text, a JSON list, {\"data\": \"nope\"} or a 401: list_models() == [] and context_window(\"qwen2.5-coder:14b\") is None.", "A base entry whose max_model_len is 0, -1, True, \"32768\" or None gives context_window None; entries without a string id ({\"no\": \"id\"}, {\"id\": \"\"}) are left out of list_models.", "infer_quantization gives \"AWQ\" for \"Qwen/Qwen2.5-Coder-14B-Instruct-AWQ\", \"GPTQ\" for \"Qwen/Qwen2.5-7B-Instruct-GPTQ-Int4\", \"FP8\" for \"neuralmagic/Meta-Llama-3.1-8B-Instruct-FP8\", \"bitsandbytes\" for \"unsloth/llama-3-8b-bnb-4bit\", \"W4A16\" for \"RedHatAI/Qwen2.5-7B-Instruct-quantized.w4a16\", \"AWQ\" for (\"qwen2.5-coder:14b\", \"Qwen/Qwen2.5-Coder-14B-Instruct-AWQ\") (the second name), and None for \"Qwen/Qwen2.5-Coder-14B-Instruct\", \"hawq-model\" (whole words only) and no names.", "The existing tests in tests/test_backends.py and tests/test_context_window_probe.py pass."]
