id = "SK8-1"
title = "compaction: a sectioned summary (Objective, Decisions, Done, ...) that a later compaction updates instead of nesting"
status = "verified"
why = "First slice of roadmap item memory-sessions-structured-compaction. compact_history asks for 'a concise paragraph', so what a small model needs to carry on (the objective, what is done, what is next, the files) is often lost, and a second compaction summarises the first summary again, inside the new one, losing more each time."
hints = "1) evi/history.py: add this function directly above `def compaction_messages(`:\n\ndef previous_summary(messages: Sequence[Mapping[str, Any]]) -> tuple[str, list[Mapping[str, Any]]]:\n    \"\"\"The summary an earlier compaction left at the start of `messages`\n    (compaction_messages' note), and the messages after it, its\n    acknowledgement left out too; (\"\", messages) when they don't start with\n    one. A new compaction updates that summary instead of nesting it.\"\"\"\n    msgs = list(messages)\n    first = msgs[0] if msgs else {}\n    content = first.get(\"content\")\n    if first.get(\"role\") != \"user\" or not isinstance(content, str) \\\n            or not content.startswith(\"[compacted: \"):\n        return \"\", msgs\n    summary = content.partition(\"\\n\\n\")[2].strip()\n    rest = msgs[1:]\n    if rest and rest[0].get(\"role\") == \"assistant\" and rest[0].get(\"content\") == COMPACTION_ACK:\n        rest = rest[1:]\n    return summary, rest\n\n2) evi/llm/agent.py: (a) add `previous_summary,` as the first name inside the existing `from evi.history import (` block; (b) add this directly above `def _render_for_summary(`:\n\n# The headings of every compaction summary, in this order: what a model needs\n# to carry on from the summary alone.\nSUMMARY_SECTIONS = (\"Objective\", \"Decisions\", \"Done\", \"In progress\", \"Files\", \"Blockers\",\n                    \"Next step\")\n\n\ndef _summary_prompt(rendered: str, previous: str = \"\", focus: str = \"\") -> str:\n    \"\"\"The request for a compaction summary of `rendered` (a transcript from\n    _render_for_summary): SUMMARY_SECTIONS as headings, the earlier summary\n    to update when there is one (`previous`), and the user's focus\n    (`/compact <focus>`) word for word.\"\"\"\n    headings = \"\\n\".join(f\"## {s}\" for s in SUMMARY_SECTIONS)\n    parts = [\n        \"Summarise the conversation below so the assistant can carry on from the \"\n        \"summary alone. Use exactly these headings, with a few short lines under each \"\n        \"('none' when there is nothing), and keep concrete facts: file paths, \"\n        \"commands, names, numbers and decisions. Do not invent details. Aim for \"\n        \"under 400 words.\\n\\n\" + headings,\n    ]\n    if previous:\n        parts.append(\"The conversation before this part was already summarised. Update \"\n                     \"that summary with the conversation below: keep what still holds, \"\n                     \"change what changed, and lose nothing that matters.\\n\\nEarlier \"\n                     \"summary:\\n\" + previous)\n    if focus:\n        parts.append(f\"Pay particular attention to: {focus}\")\n    parts.append(\"Conversation:\\n\\n\" + rendered)\n    return \"\\n\\n\".join(parts)\n\n(c) compact_history's signature becomes `def compact_history(self, keep_recent: int | None = None, focus: str = \"\") -> int:` (the focus is for SK8-2's /compact <focus>); (d) in compact_history, replace the comment `# Render the slice we want to summarise as a plain transcript.`, the `rendered = ...` line and the whole `summary_prompt = (...)` assignment with:\n        # The slice to summarise as a plain transcript; an earlier summary at\n        # its start is updated rather than summarised again.\n        previous, fresh = previous_summary(middle)\n        summary_prompt = _summary_prompt(_render_for_summary(fresh), previous, focus.strip())\nChange nothing else.\n3) Tests in a NEW file tests/test_structured_compaction.py. Compaction makes a NON-streaming request (stream=False) and reads resp.choices[0].message.content, so tests need their own fake client, e.g.\nclass _Summarizer:\n    def __init__(self, *replies):\n        self.replies, self.requests = list(replies), []\n        self.chat = SimpleNamespace(completions=SimpleNamespace(create=self.create))\n    def create(self, **kw):\n        self.requests.append(kw)\n        return SimpleNamespace(choices=[SimpleNamespace(message=SimpleNamespace(content=self.replies.pop(0)))])\nand an Agent(client=_Summarizer('...'), config=Config(), transcripts=None, tools=[]) whose history gets 30 user/assistant pairs appended, then agent.compact_history(keep_recent=4). The summary request's prompt is client.requests[0]['messages'][1]['content']."
acceptance = ["The first compaction's summary prompt contains every heading of SUMMARY_SECTIONS as '## <name>' and no 'Earlier summary'; the history afterwards passes evi.history.validate_history.", "After 10 more user/assistant pairs, a second compaction's prompt contains 'Earlier summary:' followed by the first summary text, the part after 'Conversation:' contains no '[compacted:' note, and the history then holds exactly one '[compacted:' message (the new summary) and still validates.", "compact_history(focus='the database migration') puts 'Pay particular attention to: the database migration' in the prompt; with no focus there is no such line.", "previous_summary([note, ack, rest]) == ('old', [rest]) for note = {'role': 'user', 'content': '[compacted: 8 earlier messages summarised]\\n\\nold'} and ack the COMPACTION_ACK assistant message; previous_summary([note, rest]) == ('old', [rest]); previous_summary([rest]) == ('', [rest]); previous_summary([]) == ('', []).", "The existing tests in tests/test_history_validity.py and tests/test_cli_resume_alignment.py pass."]
