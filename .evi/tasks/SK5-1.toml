id = "SK5-1"
title = "backends: Backend.context_window(model) reports the window a server runs a model with; Ollama reads it from /api/ps"
status = "open"
why = "First slice of roadmap item models-ops-context-window-probe. eVi budgets the conversation against [llm] context_size, a number the user types, while the server may run the model with a smaller window (Ollama loads it with OLLAMA_CONTEXT_LENGTH or a Modelfile num_ctx) and silently drops the start of a longer prompt. Ollama 0.34 reports each loaded model's real window in GET /api/ps as context_length (checked against the RTX host: qwen2.5-coder:14b loaded with 32768). This task adds the probe; the director makes the session use it afterwards."
hints = "1) evi/backends/base.py: add this module-level function directly above `class Backend(ABC):`:\n\ndef window_tokens(value: object) -> int | None:\n    \"\"\"`value` when it is a window size a server reported (a positive int,\n    not a bool), else None.\"\"\"\n    if isinstance(value, int) and not isinstance(value, bool) and value > 0:\n        return value\n    return None\n\nand this method to class Backend, directly above `def supports_pull` (around line 83):\n\n    def context_window(self, model_id: str) -> int | None:\n        \"\"\"The context window, in tokens, that `model_id` runs with on this\n        server now; None when the server doesn't say, and the configured\n        [llm] context_size stands. Answers fast or not at all (an unreachable\n        server is None); callers cache it.\"\"\"\n        return None\n\n2) evi/backends/ollama.py: import window_tokens (`from evi.backends.base import Backend, ModelInfo, PullProgress, window_tokens`) and add this method to OllamaBackend directly above `def pull_model`:\n\n    def context_window(self, model_id: str) -> int | None:\n        \"\"\"The window Ollama loaded `model_id` with (`/api/ps`:\n        context_length). None while it isn't loaded: Ollama picks the window\n        when it loads the model (OLLAMA_CONTEXT_LENGTH, a Modelfile num_ctx),\n        and /api/show's context_length is only the model's own maximum.\"\"\"\n        from evi.portprobe import fast_get\n\n        r = fast_get(f\"{self.native_base}/api/ps\")\n        if r is None or r.status_code != 200:\n            return None\n        try:\n            data = r.json()\n        except ValueError:\n            return None\n        models = data.get(\"models\") if isinstance(data, dict) else None\n        want = model_id if \":\" in model_id else f\"{model_id}:latest\"\n        for entry in models if isinstance(models, list) else []:\n            if isinstance(entry, dict) and want in (entry.get(\"name\"), entry.get(\"model\")):\n                return window_tokens(entry.get(\"context_length\"))\n        return None\n\nChange nothing else.\n3) Tests in a NEW file tests/test_context_window_probe.py, using the HTTP fake the backend tests use: `from tests.test_backends import _patch_httpx`, then `_patch_httpx(monkeypatch, handler)` where handler(request) returns an httpx.Response (see test_ollama_list_models_includes_details in tests/test_backends.py). Comments state why in one line."
acceptance = ["OllamaBackend('http://host:11434/v1').context_window('qwen2.5-coder:14b') is 8192 when GET http://host:11434/api/ps answers {\"models\": [{\"name\": \"qwen2.5-coder:14b\", \"model\": \"qwen2.5-coder:14b\", \"context_length\": 8192}]}, and the request went to /api/ps.", "A model id without a tag matches the ':latest' entry ('llama3' finds 'llama3:latest'); a model that isn't in the list gives None.", "None, never an exception, for: a 500 answer, a body that isn't JSON, a JSON list, \"models\" that isn't a list, a context_length of True, 0 or a string, and an unreachable server (portprobe.fast_get returning None).", "The base Backend (e.g. OpenAICompatBackend('http://h/v1').context_window('m')) returns None; window_tokens(8192) == 8192 and window_tokens is None for 0, -1, True, '8192', None and 2.5.", "The existing tests in tests/test_backends.py pass."]
