reviewer_notes = [{at = "2026-10-24T11:03:48Z", verdict = "reopened", note = "Director review (round 1). The code edits in evi/apps/cli/main.py and evi/apps/web/server.py are right: do not change them. But the tests in tests/test_compact_focus.py call agent.compact_history(...) directly, so they never reach the code this task changed (they pass without it). The criteria are about the /compact COMMANDS. Replace the three tests (keep the _Summarizer class) with these, which call the two handlers:\n\nimport io\n\nfrom rich.console import Console\n\nimport evi.apps.cli.main as cli_main\nimport evi.apps.web.server as server_mod\nfrom evi.commands import CommandStore\n\ndef _agent(client):\n    agent = Agent(client=client, config=Config(), tools=[], transcripts=None)\n    for i in range(20):\n        agent.history += [{\"role\": \"user\", \"content\": f\"q{i}\"}, {\"role\": \"assistant\", \"content\": f\"a{i}\"}]\n    return agent\n\ndef _cli(agent, args, tmp_path, monkeypatch):\n    monkeypatch.setattr(cli_main, \"console\", Console(file=io.StringIO()))\n    cli_main._handle_compact(agent, args, CommandStore(root=tmp_path))\n\ndef test_the_repl_compact_command_passes_its_focus(tmp_path, monkeypatch):\n    client = _Summarizer(\"s\")\n    _cli(_agent(client), \"  keep the API keys question  \", tmp_path, monkeypatch)\n    assert \"Pay particular attention to: keep the API keys question\\n\" in client.requests[0][\"messages\"][1][\"content\"]\n\ndef test_the_web_compact_command_passes_its_focus(tmp_path):\n    client = _Summarizer(\"s\")\n    server_mod._handle_slash(_agent(client), \"/compact keep the API keys question\", CommandStore(root=tmp_path))\n    assert \"Pay particular attention to: keep the API keys question\\n\" in client.requests[0][\"messages\"][1][\"content\"]\n\ndef test_a_bare_compact_has_no_focus_line(tmp_path, monkeypatch):\n    client = _Summarizer(\"s\")\n    _cli(_agent(client), \"\", tmp_path, monkeypatch)\n    client2 = _Summarizer(\"s\")\n    server_mod._handle_slash(_agent(client2), \"/compact\", CommandStore(root=tmp_path))\n    for c in (client, client2):\n        assert \"Pay particular attention\" not in c.requests[0][\"messages\"][1][\"content\"]\n\nPut the imports at the top with the others (stdlib, then third-party, then evi, a blank line between groups) and two blank lines between top-level definitions. Run the required checks and quote their last lines."}, {at = "2026-10-24T11:11:21Z", verdict = "director", note = "finished by the director on task/SK8-2 after 2 implementer attempt(s)"}]

