hints = "Two one-line edits, nothing else: (1) evi/apps/cli/main.py, _handle_compact (search for `def _handle_compact`): `collapsed = agent.compact_history()` becomes `collapsed = agent.compact_history(focus=args.strip())`. (2) evi/apps/web/server.py, the `if name == \"compact\":` branch of _handle_slash (search for it): `collapsed = agent.compact_history()` becomes `collapsed = agent.compact_history(focus=args)` (args is already stripped there). Also update the /compact help text in both files (search for `(\"/compact\",`) to mention the optional focus, e.g. '/compact [focus]'.\nTests in a NEW file tests/test_compact_focus.py: call cli_main._handle_compact(agent, '  keep the API keys question  ', CommandStore(root=tmp_path)) with monkeypatch.setattr(cli_main, 'console', Console(file=io.StringIO())), and server_mod._handle_slash(agent, '/compact keep the API keys question', CommandStore(root=tmp_path)) (server_mod is evi.apps.web.server). Compaction makes a NON-streaming request (stream=False) and reads resp.choices[0].message.content, so tests need their own fake client, e.g.\nclass _Summarizer:\n    def __init__(self, *replies):\n        self.replies, self.requests = list(replies), []\n        self.chat = SimpleNamespace(completions=SimpleNamespace(create=self.create))\n    def create(self, **kw):\n        self.requests.append(kw)\n        return SimpleNamespace(choices=[SimpleNamespace(message=SimpleNamespace(content=self.replies.pop(0)))])\nand an Agent(client=_Summarizer('...'), config=Config(), transcripts=None, tools=[]) whose history gets 30 user/assistant pairs appended, then agent.compact_history(keep_recent=4). The summary request's prompt is client.requests[0]['messages'][1]['content']."
