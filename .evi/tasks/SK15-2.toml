id = "SK15-2"
title = "secretscan: find secrets in text, files, a git work tree or the lines a diff adds (new module evi/secretscan.py)"
status = "verified"
why = "First slice of roadmap item safety-secret-scan-cli (Phase 6 Track A). eVi can redact secrets from what it shows (evi/redact.py) but has no way to look for them in a change, so nothing stops a task or the agent from committing a token. This module finds what redaction would hide, by shape (redact.PATTERNS) and by value (the secrets this machine holds, redact._known), and reports path, line and kind, never the secret. SK15-3 adds the `evi secrets scan` command on top; the verify gate and the commit guard use it later."
hints = "Create the NEW file evi/secretscan.py with exactly this content (it was run against every acceptance criterion before filing):\n\n\"\"\"Secret scanning: `evi secrets scan`.\n\nFinds what `evi.redact` would redact — a token, key or private-key block by\nits shape (`evi.redact.PATTERNS`), or a secret this machine holds (an\n`[llm]` api_key, a ``*_KEY`` / ``*_TOKEN`` / ``*_SECRET`` variable, the\ndirector key) by its value — in files or in the lines a git diff adds. A\nfinding names the file, the line and the kind of secret, never the secret\nitself.\n\nPure apart from reading files and running git (`evi.gitsafe.run_git`, so a\nrepository's own config runs no program).\n\"\"\"\n\nfrom __future__ import annotations\n\nfrom dataclasses import dataclass\nfrom pathlib import Path\nfrom typing import Iterable\n\n# Files bigger than this are skipped (a build artifact, a database), and so\n# is a file whose first 8 KB hold a NUL byte (a binary).\nMAX_BYTES = 1_000_000\n\n\nclass ScanError(RuntimeError):\n    \"\"\"The scan could not run: no git, not a repository, a bad ref.\"\"\"\n\n\n@dataclass(frozen=True)\nclass Finding:\n    path: str   # as given, or relative to the repository (/-separated)\n    line: int   # 1-based\n    kind: str   # the redaction kind: \"github_token\", \"private_key\", ...\n\n\ndef scan_text(text: str, path: str = \"\") -> list[Finding]:\n    \"\"\"The secrets in `text`, one Finding per (line, kind), in line order.\n    A multi-line match (a private-key block) counts on the line it starts.\"\"\"\n    from evi.redact import PATTERNS, _known\n\n    hits: set[tuple[int, str]] = set()\n\n    def line_of(pos: int) -> int:\n        return text.count(\"\\n\", 0, pos) + 1\n\n    known = _known()\n    if known.rx is not None:\n        for m in known.rx.finditer(text):\n            hits.add((line_of(m.start()), known.kinds.get(m.group(0), \"secret\")))\n    for kind, rx in PATTERNS:\n        for m in rx.finditer(text):\n            hits.add((line_of(m.start(\"s\")), kind))\n    return [Finding(path, line, kind) for line, kind in sorted(hits)]\n\n\ndef _readable(p: Path) -> str | None:\n    \"\"\"`p`'s text, or None for one that is too big, binary or unreadable.\"\"\"\n    try:\n        if p.stat().st_size > MAX_BYTES:\n            return None\n        data = p.read_bytes()\n    except OSError:\n        return None\n    if b\"\\0\" in data[:8192]:\n        return None\n    return data.decode(\"utf-8\", errors=\"replace\")\n\n\ndef _git(args: list[str], repo: Path) -> str:\n    from evi.gitsafe import run_git\n\n    try:\n        r = run_git(args, cwd=repo, timeout=60)\n    except Exception as exc:  # noqa: BLE001 — no git, an unsafe repo, a timeout\n        raise ScanError(f\"git {args[0]}: {exc}\") from exc\n    if r.returncode != 0:\n        raise ScanError(f\"git {args[0]}: {(r.stderr or r.stdout).strip()[:300]}\")\n    return r.stdout\n\n\ndef scan_paths(paths: Iterable[str | Path], root: str | Path = \".\") -> list[Finding]:\n    \"\"\"The secrets in `paths` (files, or folders walked; a .git folder is\n    skipped), each shown relative to `root` when it is under it.\"\"\"\n    base = Path(root)\n    out: list[Finding] = []\n    for given in paths:\n        p = Path(given)\n        if not p.is_absolute():\n            p = base / p\n        files = sorted(f for f in p.rglob(\"*\") if f.is_file() and \".git\" not in f.parts) \\\n            if p.is_dir() else [p]\n        for f in files:\n            text = _readable(f)\n            if text is None:\n                continue\n            try:\n                shown = f.relative_to(base).as_posix()\n            except ValueError:\n                shown = str(f)\n            out += scan_text(text, shown)\n    return out\n\n\ndef scan_tree(repo: str | Path = \".\") -> list[Finding]:\n    \"\"\"The secrets in the work tree of the git repository `repo`: its\n    tracked files and the untracked ones git doesn't ignore.\"\"\"\n    root = Path(repo)\n    names = _git([\"ls-files\", \"-z\", \"--cached\", \"--others\", \"--exclude-standard\"], root)\n    return scan_paths([n for n in sorted(set(names.split(\"\\0\"))) if n], root)\n\n\ndef scan_diff(repo: str | Path = \".\", base: str = \"HEAD\") -> list[Finding]:\n    \"\"\"The secrets in the lines `git diff <base>` adds in `repo` (the work\n    tree against `base`), each on its line in the new file.\"\"\"\n    from evi.gitsafe import validate_ref\n\n    root = Path(repo)\n    diff = _git([\"diff\", \"--no-color\", \"--no-ext-diff\", \"--unified=0\",\n                 validate_ref(base), \"--\"], root)\n    out: list[Finding] = []\n    path, line = \"\", 0\n    added: list[str] = []\n    first = 0\n\n    def flush() -> None:\n        if path and added:\n            for f in scan_text(\"\\n\".join(added), path):\n                out.append(Finding(path, first + f.line - 1, f.kind))\n\n    for raw in diff.splitlines():\n        if raw.startswith(\"+++ \"):\n            flush()\n            added, name = [], raw[4:]\n            path = name[2:] if name.startswith(\"b/\") else \"\"\n        elif raw.startswith(\"@@\"):\n            flush()\n            added = []\n            new = raw.split(\"+\", 1)[1].split(\" \", 1)[0]\n            line = first = int(new.split(\",\", 1)[0] or 0)\n        elif raw.startswith(\"+\") and path:\n            if not added:\n                first = line\n            added.append(raw[1:])\n            line += 1\n    flush()\n    return out\n\nCreate the NEW file tests/test_secretscan.py with exactly this content (keep the GitHub token split in two string pieces, \"ghp_\" + \"...\": written whole, GitHub's push protection blocks the push):\n\n\"\"\"`evi secrets scan`: secrets in files, a work tree or a diff, never shown.\"\"\"\n\nfrom __future__ import annotations\n\nimport subprocess\n\nimport pytest\n\nfrom evi import redact, secretscan\n\nGH = \"ghp_\" + \"A1b2C3d4E5f6G7h8I9j0K1l2M3n4O5p6Q7r8\"  # a GitHub token's shape\nKEY = \"-----BEGIN RSA PRIVATE KEY-----\\nMIIEowIBAAKCAQEAx4f0Zt1n4bH0aK7Q2pL9vR3sT5uW7yZ\\n-----END RSA PRIVATE KEY-----\\n\"\n\n\n@pytest.fixture(autouse=True)\ndef no_known_values(monkeypatch):\n    \"\"\"Only shapes count unless a test names a known value: the machine's own\n    keys (env, ~/.evi) stay out of it.\"\"\"\n    monkeypatch.setattr(redact, \"_known\", lambda: redact._compile({}))\n\n\ndef test_a_token_is_found_on_its_line_and_not_shown():\n    [f] = secretscan.scan_text(f\"a = 1\\ntoken = '{GH}'\\n\", \"cfg.py\")\n    assert f == secretscan.Finding(\"cfg.py\", 2, \"github_token\")\n    assert GH not in repr(f)\n\n\ndef test_a_private_key_block_counts_on_its_first_line():\n    assert secretscan.scan_text(\"x\\n\" + KEY) == [secretscan.Finding(\"\", 2, \"private_key\")]\n\n\ndef test_a_known_value_is_found_by_its_value(monkeypatch):\n    monkeypatch.setattr(redact, \"_known\", lambda: redact._compile({\"hunter2-value-xyz\": \"llm\"}))\n    assert secretscan.scan_text(\"pw: hunter2-value-xyz\") == [secretscan.Finding(\"\", 1, \"llm\")]\n\n\ndef test_clean_text_has_no_findings():\n    assert secretscan.scan_text(\"nothing to see\\nhere = 'sk-'\\n\") == []\n\n\ndef test_scan_paths_walks_folders_and_skips_binaries_and_dot_git(tmp_path):\n    (tmp_path / \"src\").mkdir()\n    (tmp_path / \"src\" / \"a.py\").write_text(f\"t = '{GH}'\\n\", encoding=\"utf-8\")\n    (tmp_path / \"blob.bin\").write_bytes(b\"\\0\" + GH.encode())\n    (tmp_path / \".git\").mkdir()\n    (tmp_path / \".git\" / \"config\").write_text(GH, encoding=\"utf-8\")\n    found = secretscan.scan_paths([\".\"], tmp_path)\n    assert found == [secretscan.Finding(\"src/a.py\", 1, \"github_token\")]\n\n\ndef _git(repo, *args):\n    subprocess.run([\"git\", \"-C\", str(repo), \"-c\", \"user.name=t\", \"-c\", \"user.email=t@t\",\n                    *args], check=True, capture_output=True)\n\n\n@pytest.fixture\ndef repo(tmp_path):\n    _git(tmp_path, \"init\", \"-q\")\n    (tmp_path / \"old.txt\").write_text(f\"old = '{GH}'\\n\", encoding=\"utf-8\")\n    (tmp_path / \".gitignore\").write_text(\"ignored.txt\\n\", encoding=\"utf-8\")\n    _git(tmp_path, \"add\", \"-A\")\n    _git(tmp_path, \"commit\", \"-q\", \"-m\", \"base\")\n    return tmp_path\n\n\ndef test_scan_tree_covers_tracked_and_untracked_but_not_ignored(repo):\n    (repo / \"new.txt\").write_text(GH, encoding=\"utf-8\")\n    (repo / \"ignored.txt\").write_text(GH, encoding=\"utf-8\")\n    assert {f.path for f in secretscan.scan_tree(repo)} == {\"old.txt\", \"new.txt\"}\n\n\ndef test_scan_diff_sees_only_added_lines_on_their_new_line_numbers(repo):\n    (repo / \"old.txt\").write_text(f\"one\\ntwo\\nold = '{GH}'\\nfresh = '{GH}x'\\n\",\n                                  encoding=\"utf-8\")\n    assert secretscan.scan_diff(repo, \"HEAD\") == [\n        secretscan.Finding(\"old.txt\", 4, \"github_token\")]\n\n\ndef test_scan_diff_refuses_an_option_as_ref(repo):\n    with pytest.raises(ValueError):\n        secretscan.scan_diff(repo, \"--output=x\")\n\nChange no other file."
acceptance = ["scan_text(\"a = 1\ntoken = '<a ghp_ token>'\n\", \"cfg.py\") == [Finding(\"cfg.py\", 2, \"github_token\")], and the Finding's repr does not contain the token.", "A private-key block starting on line 2 gives one Finding on line 2 with kind \"private_key\".", "With redact._known monkeypatched to redact._compile({\"hunter2-value-xyz\": \"llm\"}), scan_text(\"pw: hunter2-value-xyz\") == [Finding(\"\", 1, \"llm\")].", "scan_paths([\".\"], root) walks folders, shows paths relative to root with /, and skips files under .git and files with a NUL byte in their first 8 KB.", "In a git repository, scan_tree covers tracked files and untracked ones git doesn't ignore, but not ignored ones.", "scan_diff(repo, \"HEAD\") reports only lines the work tree adds against HEAD, on their line numbers in the new file; scan_diff(repo, \"--output=x\") raises ValueError (evi.gitsafe.UnsafeRefError) and runs no git."]
