id = "SK5-2"
title = "backends: llama.cpp (/props n_ctx) and LM Studio (/api/v0 loaded_context_length) report their context window"
status = "verified"
why = "Second slice of roadmap item models-ops-context-window-probe, after SK5-1 added Backend.context_window and window_tokens. llama-server reports the window it was started with (-c) in GET /props, and LM Studio reports a loaded model's window in GET /api/v0/models/{id}."
hints = "Read evi/backends/base.py first (SK5-1's window_tokens and context_window are there). 1) evi/backends/llamacpp.py: import window_tokens (`from evi.backends.base import Backend, window_tokens`) and add this method at the end of class LlamaCppBackend:\n\n    def context_window(self, model_id: str) -> int | None:\n        \"\"\"The window llama-server runs with (`/props`: n_ctx, under\n        default_generation_settings in current builds and at the top level\n        in older ones). A llama-server serves one model, so `model_id` is not\n        needed.\"\"\"\n        from evi.portprobe import fast_get\n\n        root = self._effective_base_url().rstrip(\"/\").removesuffix(\"/v1\")\n        r = fast_get(f\"{root}/props\")\n        if r is None or r.status_code != 200:\n            return None\n        try:\n            data = r.json()\n        except ValueError:\n            return None\n        if not isinstance(data, dict):\n            return None\n        settings = data.get(\"default_generation_settings\")\n        if isinstance(settings, dict) and window_tokens(settings.get(\"n_ctx\")):\n            return window_tokens(settings.get(\"n_ctx\"))\n        return window_tokens(data.get(\"n_ctx\"))\n\n2) evi/backends/lmstudio.py: the same import, and this method at the end of class LMStudioBackend:\n\n    def context_window(self, model_id: str) -> int | None:\n        \"\"\"The window LM Studio loaded `model_id` with (its REST API,\n        `/api/v0/models/{id}`: loaded_context_length). None while it isn't\n        loaded, or from an LM Studio too old to have /api/v0.\"\"\"\n        from urllib.parse import quote\n\n        from evi.portprobe import fast_get\n\n        root = self.base_url.rstrip(\"/\").removesuffix(\"/v1\")\n        r = fast_get(f\"{root}/api/v0/models/{quote(model_id, safe='/')}\")\n        if r is None or r.status_code != 200:\n            return None\n        try:\n            data = r.json()\n        except ValueError:\n            return None\n        if not isinstance(data, dict) or data.get(\"state\") != \"loaded\":\n            return None\n        return window_tokens(data.get(\"loaded_context_length\"))\n\nChange nothing else.\n3) Tests in tests/test_context_window_probe.py (it exists: read it, then ADD to it with edit_file or apply_patch, keeping every SK5-1 test), using the HTTP fake the backend tests use: `from tests.test_backends import _patch_httpx`, then `_patch_httpx(monkeypatch, handler)` where handler(request) returns an httpx.Response (see test_ollama_list_models_includes_details in tests/test_backends.py). Comments state why in one line. Build the llama.cpp backend as LlamaCppBackend('http://h:8080/v1', discover_ports=False) so it doesn't scan ports."
acceptance = ["LlamaCppBackend('http://h:8080/v1', discover_ports=False).context_window('x') asks http://h:8080/props and returns 8192 for {\"default_generation_settings\": {\"n_ctx\": 8192}}, 4096 for {\"n_ctx\": 4096}, 2048 for {\"default_generation_settings\": {\"n_ctx\": 0}, \"n_ctx\": 2048}, and None for {\"default_generation_settings\": {}}.", "LMStudioBackend('http://h:1234/v1').context_window('qwen/qwen3-8b') asks /api/v0/models/qwen/qwen3-8b and returns 4096 for {\"state\": \"loaded\", \"loaded_context_length\": 4096, \"max_context_length\": 32768}; None when state is 'not-loaded', and for a 404.", "Both return None, never raise, for a body that isn't JSON or a JSON list.", "The SK5-1 tests and tests/test_backends.py still pass."]
files_in_scope = ["evi/backends/llamacpp.py", "evi/backends/lmstudio.py", "tests/test_context_window_probe.py"]
