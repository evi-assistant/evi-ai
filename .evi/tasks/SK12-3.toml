id = "SK12-3"
title = "evals: a case can seed a conversation and compact it first (the recall eval's harness)"
status = "verified"
why = "Part of roadmap item memory-sessions-structured-compaction (a recall eval). Compaction's quality is untested against a real model: nothing checks that a fact from early in a conversation is still there after the summary. This task lets an eval case seed a conversation (`history`) and compact it before the prompt (`compact`); the recall cases themselves and recording them are the director's."
hints = "Make exactly these five edits to evi/evals.py and nothing else (the code was run against every acceptance criterion before filing):\n\n1. In the EvalCase dataclass, directly after the line `    tags: list[str] = field(default_factory=list)`, add:\n\n    # A conversation before the prompt ({role, content}, user or assistant),\n    # and whether to compact it first: a recall case asks about a fact the\n    # summary has to keep.\n    history: list[dict[str, str]] = field(default_factory=list)\n    compact: bool = False\n\n2. In _CASE_KEYS, change the line `    \"max_turns\", \"runs\", \"pass_rate\", \"fake\", \"expected_fail\", \"tags\",` to:\n\n    \"max_turns\", \"runs\", \"pass_rate\", \"fake\", \"expected_fail\", \"tags\", \"history\", \"compact\",\n\n3. Directly above `def _expect_tools(`, add this function (two blank lines before and after):\n\ndef _history(raw: Any, where: str) -> list[dict[str, str]]:\n    if raw is None:\n        return []\n    if not isinstance(raw, list):\n        raise EvalError(f\"{where}: `history` is a list of {{role, content}} messages\")\n    out = []\n    for m in raw:\n        if not isinstance(m, dict) or set(m) != {\"role\", \"content\"} \\\n                or m[\"role\"] not in (\"user\", \"assistant\") or not isinstance(m[\"content\"], str):\n            raise EvalError(f\"{where}: each `history` message is {{role = \\\"user\\\" or \"\n                            \"\\\"assistant\\\", content = \\\"...\\\"}\")\n        out.append({\"role\": m[\"role\"], \"content\": m[\"content\"]})\n    return out\n\n4. In _parse_case, directly after the line `    diff_only = c.get(\"diff_touches_only\")`, add:\n\n    history = _history(c.get(\"history\"), where)\n    compact = _bool(c.get(\"compact\", False), where, \"compact\")\n    if compact and not history:\n        raise EvalError(f\"{where}: `compact` compacts the case's `history`, which it doesn't have\")\n\nand in the EvalCase(...) it returns, directly after `        tags=_str_list(c.get(\"tags\"), where, \"tags\"),`, add:\n\n        history=history,\n        compact=compact,\n\n5. In run_once, replace\n\n        with unattended(ENTRY, None if ctx.fake else cfg):\n            res = run_headless(\n\nwith\n\n        with unattended(ENTRY, None if ctx.fake else cfg):\n            if case.history:\n                # The conversation before the prompt, compacted first in a\n                # recall case (the fake backend writes no summary, so there it\n                # stays as it is).\n                agent.history = [agent.history[0], *(dict(m) for m in case.history)]\n                if case.compact and not agent.compact_history(keep_recent=2) and not ctx.fake:\n                    return failed(\"compacting the case's history summarised nothing\")\n            res = run_headless(\n\n(the rest of the run_headless call stays as it is).\n\nTests go in a NEW file tests/test_evals_history.py (do not edit other test files). Use the `home` fixture and the _suite/_run pattern of tests/test_evals_tool_assertions.py (copy them into the new file). For the \"real model\" criteria, build an EvalContext with backend=\"rtx\" whose make_agent wraps evals.fake_agent_factory() and replaces the agent's client with a small client that answers stream=False requests with a fixed summary (a SimpleNamespace with choices[0].message.content) and passes stream=True requests on to an evi.evals_fake.ScriptedClient(case.fake or []), recording the messages of the last streamed request. Comments state why in one line."
acceptance = ["A case with history = [{role = \"user\", content = \"...\"}, {role = \"assistant\", content = \"...\"}] and compact = true loads with case.history equal to those two messages (as dicts) and case.compact True; a case without them has history [] and compact False.", "Loading fails with an EvalError naming `history` when history is not a list, when a message's role is not user or assistant, or when a message lacks content or has another key; the role message ends with content = \"...\"} (one closing brace).", "compact = true without a history fails to load with an EvalError naming `compact`.", "On the fake backend, a recall case (six seeded messages, compact = true, a fake text reply matching its regex) passes, and no workspace is left behind.", "On a real-model context (backend 'rtx') whose client answers the summary request with a non-empty summary, the case passes, and the streamed request's messages carry the compaction summary note ('[compacted: ...') while the first seeded message's text is no longer in them verbatim.", "On that context with an empty summary, the run fails with the reason \"compacting the case's history summarised nothing\".", "A case with a history and no compact runs with the seeded messages, in order, between the system prompt and the prompt.", "The existing tests in tests/test_evals.py, tests/test_evals_tool_assertions.py and tests/test_evals_api.py pass."]
files_in_scope = ["evi/evals.py", "tests/test_evals_history.py"]
required_checks = ["python -m pytest -q tests/test_evals_history.py tests/test_evals.py tests/test_evals_tool_assertions.py tests/test_evals_api.py", "python -m ruff check evi/evals.py tests/test_evals_history.py"]
