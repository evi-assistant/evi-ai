id = "SK4-4"
title = "agent: tool calls written as <tool_call> or <function=...> text at the start of a reply are run"
status = "open"
why = "Fourth slice of roadmap item loop-tools-tool-call-repair. Hermes-style models and Qwen2.5 write a call as <tool_call>{json}</tool_call> text, and Qwen3-Coder as <function=NAME><parameter=KEY>VALUE</parameter></function>; eVi recovers only a reply that starts with JSON or a code fence, so these stream to the user as text and nothing runs. The leading-position rule stays: an example call inside prose must never run."
hints = "All in evi/llm/agent.py. 1) Directly above `def recover_text_tool_calls(` (around line 297; search for it) add exactly this:\n\n_TOOL_CALL_BLOCK = re.compile(r\"<tool_call>(.*?)(?:</tool_call>|\\Z)\", re.S)\n_FUNCTION_BLOCK = re.compile(r\"<function=([^>\\s]+)>(.*?)(?:</function>|\\Z)\", re.S)\n_PARAMETER = re.compile(r\"<parameter=([^>\\s]+)>(.*?)</parameter>\", re.S)\n# What a reply written as tagged tool calls starts with.\nTAGGED_CALL_STARTS = (\"<tool_call>\", \"<function=\")\n\n\ndef _parameter_value(text: str) -> str:\n    \"\"\"A <parameter> body without the one newline the format puts after the\n    opening tag and before the closing one (a file's own last newline stays).\"\"\"\n    if text.startswith(\"\\n\"):\n        text = text[1:]\n    if text.endswith(\"\\n\"):\n        text = text[:-1]\n    return text\n\n\ndef _recover_tagged_calls(text: str, known: set[str]) -> list[dict[str, str]]:\n    \"\"\"Calls a model wrote as tags, when `text` starts with one. Hermes and\n    Qwen2.5 put a JSON call in each <tool_call>...</tool_call>; Qwen3-Coder\n    writes <function=NAME><parameter=KEY>VALUE</parameter></function>, inside\n    <tool_call> or not. Parameter values stay strings (a tool that wants a\n    number gets it converted when the call is prepared). A block cut off\n    before its closing tag still counts. Unknown tools are skipped.\"\"\"\n    if not text.startswith(TAGGED_CALL_STARTS):\n        return []\n    out: list[dict[str, str]] = []\n    for m in _FUNCTION_BLOCK.finditer(text):\n        if m.group(1) in known:\n            params = {k: _parameter_value(v) for k, v in _PARAMETER.findall(m.group(2))}\n            out.append({\"name\": m.group(1), \"arguments\": json.dumps(params)})\n    if out:\n        return out\n    for m in _TOOL_CALL_BLOCK.finditer(text):\n        out.extend(recover_text_tool_calls(m.group(1).strip(), known))\n    return out\n\n2) In recover_text_tool_calls, right after its docstring and before `if not text or \"{\" not in text:`, add:\n\n    tagged = _recover_tagged_calls(text.lstrip(), known)\n    if tagged:\n        return tagged\n\n3) In _maybe_hold (around line 2601; search for `hold_text = head`): `hold_text = head[:1] in (\"`\", \"{\", \"[\")` gets \"<\" added to the tuple (a reply starting with '<' is held until the stream ends, then shown if it was no call).\n4) Around line 2711 (search for `_stripped[:1]`): `if _stripped[:1] in (\"`\", \"{\", \"[\"):` becomes `if _stripped[:1] in (\"`\", \"{\", \"[\") or _stripped.startswith(TAGGED_CALL_STARTS):` (wrap it as ruff wants). Do NOT add '<' there: a reply that starts with other markup must not have JSON later in it run as a call.\nChange nothing else. Tests in a NEW file tests/test_text_tool_calls_tags.py: unit tests of recover_text_tool_calls for each format, and agent tests like tests/test_read_ledger.py (fake_llm fixture; llm_text from tests.conftest; Agent with tools read_file and list_dir, unattended_policy='allow', agent.cwd set to tmp_path), checking ToolResult and TextDelta events."
acceptance = ["recover_text_tool_calls('<tool_call>\\n{\"name\": \"list_dir\", \"arguments\": {\"path\": \".\"}}\\n</tool_call>', {'list_dir'}) returns one list_dir call with arguments {\"path\": \".\"}; two <tool_call> blocks give two calls; a block missing its closing tag still counts.", "'<tool_call>\\n<function=read_file>\\n<parameter=path>\\nsrc/a.py\\n</parameter>\\n<parameter=offset>\\n5\\n</parameter>\\n</function>\\n</tool_call>' gives read_file with arguments {\"path\": \"src/a.py\", \"offset\": \"5\"}; a bare <function=...> block (no <tool_call>) works too; a multi-line parameter keeps its inner lines and blank lines, losing only the one newline after the opening tag and the one before the closing tag.", "An unknown tool in tags gives no call; text that does not START with <tool_call> or <function= (e.g. 'You could call <tool_call>...</tool_call> yourself.') gives no call.", "In an agent run, a reply that is a <tool_call> list_dir call runs list_dir (its ToolResult lists a file made in tmp_path) and no TextDelta shows the '<tool_call>' text; a reply 'You could call <tool_call>{...}</tool_call> yourself.' runs nothing; a reply '<b>bold</b> answer' still arrives as TextDelta text '<b>bold</b> answer'.", "The existing tests in tests/test_text_tool_calls.py and tests/test_agent.py pass."]
