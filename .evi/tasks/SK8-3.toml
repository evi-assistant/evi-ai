id = "SK8-3"
title = "config: [llm] compaction_model, the model that writes compaction summaries"
status = "verified"
why = "Third slice of roadmap item memory-sessions-structured-compaction. Summaries are written by the chat model; on a slow local model a compaction can take as long as a turn. [llm] compaction_model names another model (on the same backend) for it; empty keeps the chat model. fast_model is NOT used implicitly: on a one-model server (the managed llama.cpp runtime) it may not be loaded, and a failed summary call silently skips compaction."
hints = "1) evi/config.py, class LLMSettings: directly below the line `compact_keep_recent: int = 10  # leave this many turns un-summarised` add\n    # The model that writes compaction summaries; empty = the chat model.\n    compaction_model: str = \"\"\n2) evi/llm/agent.py, compact_history: in the summary request (`self.client.chat.completions.create(`), `model=self.config.llm.model,` becomes `model=self.config.llm.compaction_model or self.config.llm.model,`. Change nothing else.\n3) docs/configuration.md: in the [llm] example near the top, directly below the line that starts `context_size    = 32768`, add a line `compaction_model = \"\"` with the comment `# writes compaction summaries; empty = the chat model`, aligned like its neighbours.\nTests in a NEW file tests/test_compaction_model.py. Compaction makes a NON-streaming request (stream=False) and reads resp.choices[0].message.content, so tests need their own fake client, e.g.\nclass _Summarizer:\n    def __init__(self, *replies):\n        self.replies, self.requests = list(replies), []\n        self.chat = SimpleNamespace(completions=SimpleNamespace(create=self.create))\n    def create(self, **kw):\n        self.requests.append(kw)\n        return SimpleNamespace(choices=[SimpleNamespace(message=SimpleNamespace(content=self.replies.pop(0)))])\nand an Agent(client=_Summarizer('...'), config=Config(), transcripts=None, tools=[]) whose history gets 30 user/assistant pairs appended, then agent.compact_history(keep_recent=4). The summary request's prompt is client.requests[0]['messages'][1]['content']."
acceptance = ["With agent.config.llm.compaction_model = 'small-summarizer', the summary request's 'model' is 'small-summarizer'.", "With compaction_model empty (the default), it is agent.config.llm.model, even when fast_model is set.", "Config().llm.compaction_model == '', and after writing '[llm]\\ncompaction_model = \"x\"\\n' to evi.config.CONFIG_PATH (every test runs with a throwaway eVi home), Config.load().llm.compaction_model == 'x'.", "docs/configuration.md lists compaction_model in the [llm] example.", "The SK8-1 tests in tests/test_structured_compaction.py pass."]
files_in_scope = ["evi/config.py", "evi/llm/agent.py", "docs/configuration.md", "tests/test_compaction_model.py"]
required_checks = ["python -m pytest -q tests/test_compaction_model.py tests/test_structured_compaction.py", "python -m ruff check evi/config.py evi/llm/agent.py tests/test_compaction_model.py"]
