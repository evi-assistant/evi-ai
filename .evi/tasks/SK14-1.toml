id = "SK14-1"
title = "reasoning: reasoning_text, the reasoning a server sends beside content (reasoning_content / reasoning)"
status = "verified"
why = "Part of roadmap item native-reasoning-channel. Servers that parse a model's reasoning out themselves (vLLM's reasoning parsers, llama.cpp --reasoning-format, LM Studio, Ollama's /v1, DeepSeek's API, OpenRouter) send it beside `content` as `reasoning_content` or `reasoning`, and eVi drops it today. This task adds the pure reader; the agent loop showing it as thinking (and keeping it out of the answer and the history) is the director's wiring."
hints = "Make exactly these two edits to evi/reasoning.py and nothing else (the code was run against every acceptance criterion before filing):\n\n1. Directly after the line `import re` (near the top), add the line:\n\nfrom typing import Any, Mapping\n\n2. At the end of the file, after the function reasoning_extra_body (its last line is `    return {}`), add two blank lines and then exactly this:\n\n# The fields a server sends a model's reasoning in, beside `content`, in a\n# streamed delta or a whole message: `reasoning_content` (DeepSeek's API,\n# llama.cpp's --reasoning-format deepseek, LM Studio, vLLM before 0.16) and\n# `reasoning` (vLLM 0.16 on, Ollama's /v1, OpenRouter, LM Studio for gpt-oss).\nREASONING_FIELDS = (\"reasoning_content\", \"reasoning\")\n\n\ndef reasoning_text(obj: Any) -> str:\n    \"\"\"The reasoning text a streamed delta or a whole message carries outside\n    its `content`: the first of REASONING_FIELDS holding a non-empty string,\n    read as a key of a mapping, else as an attribute, else from pydantic's\n    `model_extra` (where the openai SDK keeps fields it doesn't declare).\n    Only the first one counts, since some servers send the same text under\n    both names. Anything else (None, no such field, a non-string value such\n    as a reasoning object) is \"\".\"\"\"\n    if obj is None:\n        return \"\"\n    extra = getattr(obj, \"model_extra\", None)\n    for name in REASONING_FIELDS:\n        if isinstance(obj, Mapping):\n            value = obj.get(name)\n        else:\n            value = getattr(obj, name, None)\n            if value is None and isinstance(extra, Mapping):\n                value = extra.get(name)\n        if isinstance(value, str) and value:\n            return value\n    return \"\"\n\nTests go in a NEW file tests/test_reasoning_channel.py (do not edit other test files). Import `from evi.reasoning import REASONING_FIELDS, reasoning_text`, `from types import SimpleNamespace`, `from openai.types.chat import ChatCompletionChunk, ChatCompletionMessage` and `from openai.types.chat.chat_completion_chunk import ChoiceDelta`. Every test calls reasoning_text on one object and asserts the exact string it returns: build the objects as the acceptance criteria say (SimpleNamespace for a duck-typed delta, a plain dict for a mapping, ChoiceDelta.model_validate({...}) / ChatCompletionMessage.model_validate({...}) for the openai SDK's own objects, which keep the undeclared fields as extras, and ChatCompletionChunk.model_validate({'id': 'c', 'object': 'chat.completion.chunk', 'created': 0, 'model': 'm', 'choices': [{'index': 0, 'delta': {'reasoning': 'think'}, 'finish_reason': None}]}) for a streamed chunk, reading .choices[0].delta). Use pytest.mark.parametrize for the two field names and for the list of objects that give \"\". Comments state why in one line."
acceptance = ["REASONING_FIELDS == (\"reasoning_content\", \"reasoning\").", "reasoning_text(SimpleNamespace(content=None, reasoning_content=\"step 1\")) == \"step 1\", and the same with reasoning=\"step 1\" instead.", "reasoning_text({\"content\": \"\", \"reasoning\": \"step 1\"}) == \"step 1\", and the same with the key reasoning_content.", "For the openai SDK's objects: ChoiceDelta.model_validate({\"content\": None, \"reasoning_content\": \"hmm\"}) and the same with \"reasoning\" give \"hmm\"; the delta of ChatCompletionChunk.model_validate(...) with delta {\"reasoning\": \"think\"} gives \"think\"; ChatCompletionMessage.model_validate({\"role\": \"assistant\", \"content\": \"42\", \"reasoning_content\": \"6 times 7\"}) gives \"6 times 7\".", "An object holding the field only in model_extra is read: reasoning_text(SimpleNamespace(content=None, model_extra={\"reasoning\": \"via extra\"})) == \"via extra\".", "Only the first field counts, never both: SimpleNamespace(reasoning_content=\"same\", reasoning=\"same\") gives \"same\" and {\"reasoning_content\": \"a\", \"reasoning\": \"b\"} gives \"a\".", "An empty first field falls through: SimpleNamespace(reasoning_content=\"\", reasoning=\"x\") and {\"reasoning_content\": None, \"reasoning\": \"x\"} both give \"x\".", "These give \"\": None, SimpleNamespace(content=\"answer\"), {\"content\": \"answer\"}, SimpleNamespace(reasoning={\"effort\": \"high\"}), {\"reasoning\": [\"a\"], \"reasoning_content\": 3} and ChoiceDelta.model_validate({\"content\": \"answer\"}).", "The text comes back exactly as sent: reasoning_text({\"reasoning\": \"  see </think> and <think>\\n\"}) == \"  see </think> and <think>\\n\".", "The existing tests in tests/test_reasoning.py pass."]
