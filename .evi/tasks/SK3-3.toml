id = "SK3-3"
title = "fs: write_file, edit_file and apply_patch write atomically (temp file + os.replace), keeping mode and line endings"
status = "open"
why = "The three write tools in evi/tools/fs.py (write_file, edit_file, apply_patch) write with p.write_text(..., newline=\"\"), in place: a crash, a full disk or a killed process mid-write leaves the file truncated or half-written. Third slice of roadmap item loop-tools-edit-recovery (atomic writes)."
hints = "Add this helper to evi/tools/fs.py above write_file, exactly as written (it was prototyped: CRLF kept, a failed os.replace leaves the file intact and no temp file behind, a transient sharing violation is retried, the mode is kept, new files work):\n\n_REPLACE_TRIES = 5\n\n\ndef _atomic_write(p: Path, text: str) -> None:\n    \"\"\"Write `text` to `p` (its line endings as given) through a temp file in the\n    same folder and os.replace, so a failure never leaves `p` half-written. A\n    symlink is written through to its target; `p`'s mode is kept; a replace\n    refused because another process holds the file open is retried briefly.\n    Where no temp file can be made (a folder we may not write), it writes in\n    place, as before.\"\"\"\n    target = Path(os.path.realpath(p)) if p.is_symlink() else p\n    tmp = target.with_name(f\".{target.name}.{os.getpid()}-{threading.get_ident()}.evi-tmp\")\n    try:\n        f = tmp.open(\"w\", encoding=\"utf-8\", newline=\"\")\n    except OSError:\n        target.write_text(text, encoding=\"utf-8\", newline=\"\")\n        return\n    try:\n        with f:\n            f.write(text)\n        try:\n            shutil.copymode(target, tmp)\n        except OSError:\n            pass  # a new file: the folder's default mode\n        for attempt in range(_REPLACE_TRIES):\n            try:\n                os.replace(tmp, target)\n                return\n            except PermissionError:\n                if attempt == _REPLACE_TRIES - 1:\n                    raise\n                time.sleep(0.05 * (attempt + 1))\n    finally:\n        tmp.unlink(missing_ok=True)\n\n(add `import shutil` and `import time` to the module's imports, in alphabetical order with the others).\nReplace the three in-place writes with it, and change nothing else: in write_file `p.write_text(content, encoding=\"utf-8\", newline=\"\")` becomes `_atomic_write(p, content)`; in edit_file and in apply_patch `p.write_text(new_text, encoding=\"utf-8\", newline=\"\")` becomes `_atomic_write(p, new_text)` (keep the comment on edit_file's line). write_file's p.parent.mkdir(...) stays before it.\nTests in a new tests/test_atomic_write.py. Use tmp_path for every file. Patch with monkeypatch.setattr(\"evi.tools.fs.os.replace\", ...) (it patches os.replace for the test only). Build files with write_bytes and check read_bytes."
acceptance = ["write_file, edit_file and apply_patch each leave no file other than the target in its folder (no '*.evi-tmp' left), and a CRLF file stays CRLF after edit_file.", "With os.replace patched to raise OSError, edit_file on a file holding b'a = 1\\n' raises (or returns an error) and the file still holds exactly b'a = 1\\n', with no '*.evi-tmp' left in the folder.", "With os.replace patched to raise PermissionError twice and then call the real os.replace, write_file succeeds and the file holds the new content.", "On POSIX, a file with mode 0o640 keeps mode 0o640 after edit_file (pytest.skip on Windows).", "A symlink to a file (pytest.skip when os.symlink raises OSError, as it does without a privilege on Windows) is still a symlink after write_file through it, and its target holds the new content.", "The existing tests in tests/test_tools.py, tests/test_fs_eol.py, tests/test_fs_write_lock.py, tests/test_edit_recovery.py, tests/test_apply_patch.py and tests/test_checkpoints.py pass."]
files_in_scope = ["evi/tools/fs.py", "tests/test_atomic_write.py"]
