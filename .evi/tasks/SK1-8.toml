id = "SK1-8"
title = "new evi/ignore.py: .gitignore + .eviignore rules (a pure gitignore subset) and an ignore_filter for tools"
status = "open"
why = "fs only skips the fixed _IGNORE_DIRS (evi/tools/fs.py:18-21; _is_ignored 322-328) in find_files (339-355) and search_files (367-411). The index prunes the fixed _SKIP_DIRS plus dot-folders (evi/index.py:48-53, 118-131). Nothing in evi/ reads .gitignore or .eviignore (grep; only anatomy.py shells out to git ls-files). Coverage output, generated code and data folders outside the fixed set flood find/search results and get embedded by the index. To fit a small model, roadmap item 8 is split: this task builds and tests the module alone, and SK1-8b wires it into the tools."
hints = "Rule = @dataclass(frozen=True) with regex (re.Pattern), negate, dir_only and anchored. parse_rules, per line: line = line.rstrip(); skip '' and lines starting with '#'; negate = line.startswith('!') (then drop the '!'); if line starts with '\\' drop the backslash; dir_only = line.endswith('/'), then line = line.rstrip('/'); anchored = '/' in line; line = line.lstrip('/'); skip if now empty; regex = re.compile(_translate(line)). _translate walks the pattern left to right: '**/' -> '(?:.*/)?'; '/**' at the very end -> '/.*'; '**' -> '.*'; '*' -> '[^/]*'; '?' -> '[^/]'; '[' with a later ']' -> copy the class, turning a leading '!' into '^'; any other char -> re.escape(ch). Match with regex.fullmatch. _matches(rule, rel, is_dir): False if rule.dir_only and not is_dir; target = rel if rule.anchored else rel.rsplit('/', 1)[-1]. _decide(rel, is_dir): result = False; for each rule that matches, result = not rule.negate. ignored(rel, is_dir): parts = rel.split('/'); for i in range(1, len(parts)): if _decide('/'.join(parts[:i]), True): return True; return _decide(rel, is_dir). ignore_filter: `from evi.project import git_toplevel` inside the function; prefix = base.resolve().relative_to(root).as_posix(), with '.' becoming ''. Predicate: rel = p.relative_to(base).as_posix() (ValueError -> False); full = f'{prefix}/{rel}' if prefix else rel; return rules.ignored(full, p.is_dir()). Tests: test ignored() directly with IgnoreRules(parse_rules('...')) for each acceptance case. For ignore_filter, ALWAYS create tmp_path/'repo'/'.git' as a folder, so git_toplevel stops there and never at some .git above the temp dir."
acceptance = ["New evi/ignore.py, stdlib only (plus evi.project imported inside a function). It provides parse_rules(text: str) -> list[Rule], class IgnoreRules(rules) with classmethod load(root: Path) (reads root/.gitignore then root/.eviignore if present, utf-8 with errors='replace'; later rules win) and ignored(rel: str, is_dir: bool) -> bool over a POSIX path relative to the root, and ignore_filter(base: Path) -> Callable[[Path], bool]. A module docstring states the supported subset.", "Blank lines and lines starting with '#' are skipped; trailing whitespace and '\\r' are stripped; '!' negates, and the last matching rule wins.", "A trailing '/' matches folders only: 'out/' ignores folder 'out' and the file 'out/x.txt' (through its parent), but not a FILE named 'out'.", "A pattern without '/' (ignoring a trailing one) matches the name at any depth: '*.log' ignores 'a/b/x.log'. A pattern with a leading or middle '/' is anchored to the root: '/build' ignores 'build' but not 'src/build'; 'docs/*.md' ignores 'docs/a.md' but not 'docs/sub/a.md'.", "'*' and '?' never match '/'. '**/' matches zero or more folders ('**/tmp' ignores 'tmp' and 'a/b/tmp'). A trailing '/**' matches everything inside ('logs/**' ignores 'logs/a/b.txt'). '[abc]' and '[!abc]' classes work ('*.py[cod]' ignores 'm.pyc' but not 'm.py').", "A file inside an ignored folder stays ignored even if a later '!' rule names it (git cannot re-include it): rules 'out/' then '!out/keep.txt' still ignore 'out/keep.txt'. With '*.log' then '!keep.log', 'keep.log' is NOT ignored.", "ignore_filter(base): root = evi.project.git_toplevel(base) or base.resolve(). It returns a predicate over paths as base.glob()/base.rglob() yield them. The predicate ignores nothing when there are no rules or when base itself is ignored (an explicit request wins). A subfolder base still applies the root's rules ('*.log' in repo/.gitignore makes ignore_filter(repo/'sub') true for repo/'sub'/'x.log'). A .eviignore '!keep.log' re-includes a file .gitignore '*.log' excluded.", "The predicate computes the base's prefix once with base.resolve().relative_to(root), and each path's part with p.relative_to(base), never resolving individual paths. It therefore works when base is spelled differently from the resolved root (e.g. a Windows 8.3 short temp path like C:\\Users\\CLAUDE~1\\...)."]
