id = "SK4-2"
title = "tools: Tool.prepare fits a call's arguments to the tool: coerced types, aliases, unknown arguments dropped, and a usage line when it can't be called"
status = "verified"
why = "Second slice of roadmap item loop-tools-tool-call-repair. Small models send read_file(offset='5'), file_path for path, cmd for command and arguments a tool doesn't take; each fails as a TypeError deep in the tool, and a missing argument says only 'missing 1 required positional argument'. This task adds the fitting helpers to evi/tools/repair.py (made by SK4-1) and a Tool.prepare method that returns the repaired arguments; the director wires prepare into the agent loop afterwards."
hints = "1) evi/tools/repair.py already exists (from SK4-1): read it first, then ADD to it with edit_file or apply_patch, never write_file. Change its imports to:\n\nimport ast\nimport inspect\nimport json\nimport math\nimport re\nfrom typing import Any, Callable\n\nand append exactly this at the end of the module:\n\n# Argument names models use for one the tool calls something else.\nALIASES = {\"file_path\": \"path\", \"filepath\": \"path\", \"filename\": \"path\", \"file\": \"path\",\n           \"cmd\": \"command\"}\n\n_INT = re.compile(r\"[+-]?\\d+\")\n_TRUE, _FALSE = {\"true\", \"yes\"}, {\"false\", \"no\"}\n_EXAMPLE = {\"string\": \"...\", \"integer\": 1, \"number\": 1, \"boolean\": True, \"array\": [],\n            \"object\": {}}\n\n\ndef _coerce(value: Any, schema: dict[str, Any]) -> tuple[Any, bool]:\n    \"\"\"(`value` as `schema`'s type, True) when the conversion is unambiguous;\n    (`value`, False) when it already fits or can't be converted.\"\"\"\n    kind = schema.get(\"type\")\n    if kind == \"integer\":\n        if isinstance(value, str) and _INT.fullmatch(value.strip()):\n            return int(value.strip()), True\n        if isinstance(value, float) and value.is_integer():\n            return int(value), True\n    elif kind == \"number\" and isinstance(value, str):\n        text = value.strip()\n        if _INT.fullmatch(text):\n            return int(text), True\n        try:\n            num = float(text)\n        except ValueError:\n            return value, False\n        if math.isfinite(num):\n            return num, True\n    elif kind == \"boolean\" and isinstance(value, str):\n        word = value.strip().lower()\n        if word in _TRUE | _FALSE:\n            return word in _TRUE, True\n    elif kind == \"string\":\n        if isinstance(value, (int, float)) and not isinstance(value, bool):\n            return str(value), True\n    elif kind == \"array\":\n        if isinstance(value, str):\n            parsed = loads_tolerant(value)\n            return (parsed if isinstance(parsed, list) else [value]), True\n        if value is not None and not isinstance(value, (list, dict)):\n            return [value], True\n    elif kind == \"object\" and isinstance(value, str):\n        parsed = loads_tolerant(value)\n        if isinstance(parsed, dict):\n            return parsed, True\n    return value, False\n\n\ndef fit_arguments(\n    args: dict[str, Any], schema: dict[str, Any], func: Callable[..., Any]\n) -> tuple[dict[str, Any], list[str]]:\n    \"\"\"`args` fitted to the tool: an alias renamed to the name the schema\n    uses (unless that name is given too), each value coerced to its schema\n    type (`_coerce`), and an argument `func` doesn't take dropped (none is\n    dropped for a function that takes **kwargs, such as an MCP tool's).\n    Returns the new dict and a note for each change.\"\"\"\n    props = schema.get(\"properties\") if isinstance(schema, dict) else None\n    props = props if isinstance(props, dict) else {}\n    try:\n        params = inspect.signature(func).parameters\n    except (TypeError, ValueError):\n        params = {}\n    takes_any = any(p.kind is inspect.Parameter.VAR_KEYWORD for p in params.values())\n    out: dict[str, Any] = {}\n    notes: list[str] = []\n    for key, value in args.items():\n        target = ALIASES.get(key)\n        if key not in props and target in props and target not in args and target not in out:\n            notes.append(f\"{key} -> {target}\")\n            key = target\n        out[key] = value\n    for key, value in list(out.items()):\n        sub = props.get(key)\n        if isinstance(sub, dict):\n            new, changed = _coerce(value, sub)\n            if changed:\n                out[key] = new\n                notes.append(f\"{key}: {json.dumps(value)} -> {json.dumps(new)}\")\n    if params and not takes_any:\n        for key in [k for k in out if k not in params or k == \"ctx\"]:\n            del out[key]\n            notes.append(f\"dropped unknown argument {key}\")\n    return out, notes\n\n\ndef missing_required(args: dict[str, Any], func: Callable[..., Any]) -> list[str]:\n    \"\"\"The arguments `func` needs (no default) that `args` lacks.\"\"\"\n    try:\n        params = inspect.signature(func).parameters\n    except (TypeError, ValueError):\n        return []\n    named = (inspect.Parameter.POSITIONAL_OR_KEYWORD, inspect.Parameter.KEYWORD_ONLY)\n    return [n for n, p in params.items()\n            if n != \"ctx\" and p.kind in named and p.default is inspect.Parameter.empty\n            and n not in args]\n\n\ndef usage(name: str, schema: dict[str, Any]) -> str:\n    \"\"\"How to call a tool: its arguments and their types, the required ones\n    first and the others marked '?', then an example with the required ones,\n    e.g. 'read_file(path: string, offset?: integer), e.g. {\"path\": \"...\"}'.\"\"\"\n    props = schema.get(\"properties\") if isinstance(schema, dict) else None\n    props = props if isinstance(props, dict) else {}\n    required = [r for r in (schema.get(\"required\") or []) if r in props]\n\n    def kind(key: str) -> str:\n        sub = props.get(key)\n        return str(sub.get(\"type\", \"any\")) if isinstance(sub, dict) else \"any\"\n\n    parts = [f\"{k}: {kind(k)}\" for k in required]\n    parts += [f\"{k}?: {kind(k)}\" for k in props if k not in required]\n    example = {k: _EXAMPLE.get(kind(k), \"...\") for k in required}\n    return f\"{name}({', '.join(parts)}), e.g. {json.dumps(example)}\"\n\n2) In evi/tools/base.py, add this method to class Tool right after openai_schema (lines 336-344), before call_rich; change nothing else in base.py:\n\n    def prepare(self, arguments: str) -> tuple[str, list[str], str | None]:\n        \"\"\"One call's arguments as this tool will take them (evi.tools.repair):\n        read leniently (a cut-off object is closed only for a read-only tool),\n        aliases renamed, values coerced to the schema, unknown arguments\n        dropped. Returns (the arguments as JSON, a note per repair, None);\n        arguments that needed no repair come back as the very same text.\n        When they can't be used: (`arguments`, [], an ERROR text naming how\n        to call the tool).\"\"\"\n        from evi.tools import repair\n\n        how = repair.usage(self.name, self.parameters)\n        args, notes = repair.parse_arguments(arguments, allow_truncated=bool(self.read_only))\n        if args is None:\n            return arguments, [], (\n                f\"ERROR: the arguments to {self.name} are not a JSON object. Call it as {how}\"\n            )\n        args, fitted = repair.fit_arguments(args, self.parameters, self.func)\n        missing = repair.missing_required(args, self.func)\n        if missing:\n            return arguments, [], f\"ERROR: {self.name} needs {', '.join(missing)}. Call it as {how}\"\n        notes += fitted\n        if not notes:\n            return arguments, [], None\n        return json.dumps(args, ensure_ascii=False), notes, None\n\n3) Tests: ADD to tests/test_tool_repair.py (read it first; keep every SK4-1 test). Use the real tools: `import evi.tools.fs` and `import evi.tools.shell` (they register read_file, write_file and run_command), then `from evi.tools.base import REGISTRY` and call e.g. REGISTRY['read_file'].prepare('{\"path\": \"a.py\", \"offset\": \"5\"}'). For the type coercions use fit_arguments with a small schema and a local function in the test, e.g. def f(flag: bool = False, n: float = 0, k: int = 0, items: list | None = None, opts: dict | None = None, name: str = '', **kw). Comments state why in one line."
acceptance = ["REGISTRY['read_file'].prepare('{\"path\": \"a.py\", \"offset\": \"5\"}') returns arguments that json.loads to {'path': 'a.py', 'offset': 5}, the notes ['offset: \"5\" -> 5'] and no error.", "Aliases: read_file {'file_path': 'a.py'} becomes {'path': 'a.py'} (note 'file_path -> path'); run_command {'cmd': 'ls'} becomes {'command': 'ls'}. When path is given too, file_path is dropped as an unknown argument instead.", "An argument the tool doesn't take is dropped with the note 'dropped unknown argument junk'; so is 'ctx'.", "Arguments that need no repair come back as the very same string (`is`), with [] and None.", "write_file('{\"path\": \"a\"}') gives the error 'ERROR: write_file needs content. Call it as write_file(path: string, content: string), e.g. {\"path\": \"...\", \"content\": \"...\"}' and the arguments unchanged; '[1]' to read_file gives an error starting 'ERROR: the arguments to read_file are not a JSON object. Call it as read_file(path: string, offset?: integer, limit?: integer)'.", "A cut-off '{\"path\": \"a.py\"' is accepted for read_file (read-only) but '{\"path\": \"a.py\", \"content\": \"half' to write_file is an error: nothing cut off is written as if whole.", "fit_arguments coerces 'true'/'No' to booleans, '1.5' to 1.5 and '2' to 2 for a number, 3.0 to 3 for an integer, 7 to '7' for a string, '[\"a\"]' and 'a' and 5 to lists, and '{\"k\": 1}' to a dict for an object; it leaves 'maybe' (boolean), 'nan' and 'inf' (number), 'x' (integer) and True (string) as they are, and drops nothing for a function with **kwargs.", "The existing tests in tests/test_tools.py and tests/test_tool_context.py pass."]
