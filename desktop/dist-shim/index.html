<!doctype html>
<html>
<head>
  <meta charset="utf-8" />
  <title>eVi</title>
  <style>
    html, body { height: 100%; margin: 0; }
    body {
      background: #1e293b; color: #e2e8f0;
      font-family: system-ui, "Segoe UI", sans-serif;
      display: flex; align-items: center; justify-content: center;
      flex-direction: column; gap: 20px;
    }
    .ring {
      width: 54px; height: 54px;
      border: 5px solid #334155; border-top-color: #22d3ee;
      border-radius: 50%; animation: spin 1s linear infinite;
    }
    @keyframes spin { to { transform: rotate(360deg); } }
    #msg { font-size: 16px; }
    .hint {
      color: #94a3b8; font-size: 13px; max-width: 440px;
      text-align: center; line-height: 1.5; min-height: 2.5em;
    }
    code { color: #cbd5e1; }
    .failed .ring { display: none; }
    #tail {
      display: none; max-width: 640px; max-height: 40vh; overflow: auto; margin: 0;
      background: #0f172a; color: #cbd5e1; padding: 10px 12px; border-radius: 6px;
      font-size: 12px; white-space: pre-wrap; word-break: break-word;
    }
    .failed #tail { display: block; }
  </style>
</head>
<body>
  <div class="ring"></div>
  <div id="msg">Starting eVi…</div>
  <div class="hint" id="hint"></div>
  <pre id="tail"></pre>
  <script>
    // The Rust shell injects window.__EVI_PORT__ via an initialization
    // script. We poll the local server and redirect once it's accepting
    // connections — this decouples the window from the (slow, variable)
    // onefile cold start, so the user sees a loading page immediately
    // instead of a connection-refused error.
    var port = window.__EVI_PORT__ || 8000;
    var base = "http://127.0.0.1:" + port + "/";
    var tries = 0;
    // The shell also injects the real log path (`<eVi home>/logs/...`, so it
    // follows EVI_HOME) as window.__EVI_LOG__ and, if the server process
    // exits before it answers, window.__EVI_SERVER_EXIT__ = {code, log, tail}.
    // Text only: the path and the log's lines go in with textContent.
    function logPath() {
      return window.__EVI_LOG__ || "%USERPROFILE%\\.evi\\logs\\desktop-server.log";
    }
    function hint(before, after) {
      var el = document.getElementById("hint");
      el.textContent = "";
      el.appendChild(document.createTextNode(before));
      var code = document.createElement("code");
      code.textContent = logPath();
      el.appendChild(code);
      el.appendChild(document.createTextNode(after || "."));
    }
    function showExit(info) {
      if (document.body.className === "failed") { return; }
      document.body.className = "failed";
      document.getElementById("msg").textContent =
        "eVi's server stopped while starting" +
        (typeof info.code === "number" ? " (exit code " + info.code + ")." : ".");
      if (info.log) { window.__EVI_LOG__ = info.log; }
      hint("Its log is at ", ". The last lines:");
      document.getElementById("tail").textContent = info.tail || "(the log is empty)";
    }
    // Checked on its own quick timer: a poll round can take seconds (a refused
    // connection to a port nothing listens on is slow on Windows).
    var exitWatch = setInterval(function () {
      if (window.__EVI_SERVER_EXIT__) {
        clearInterval(exitWatch);
        showExit(window.__EVI_SERVER_EXIT__);
      }
    }, 250);
    function poll() {
      if (window.__EVI_SERVER_EXIT__) { showExit(window.__EVI_SERVER_EXIT__); return; }
      tries++;
      // no-cors: resolves on ANY response (server is up), rejects on a
      // connection error (server not up yet).
      fetch(base + "api/health", { mode: "no-cors", cache: "no-store" })
        .then(function () {
          // Redirect with a per-launch cache-buster so the WebView2 cache can
          // never serve a stale index.html after the sidecar auto-updates — the
          // whole UI's JS is inlined there, so a cached page = a cached UI, and
          // the user would otherwise have to hit Ctrl+R to see an update. The
          // sidecar serves `/` regardless of query string; the app ignores it.
          window.location.replace(base + "?_ui=" + Date.now());
        })
        .catch(function () {
          if (tries === 15) {
            hint("First launch unpacks the bundled Python server, which can take " +
                 "a bit. If this persists, check the log at ");
          }
          setTimeout(poll, 600);
        });
    }
    poll();
  </script>
</body>
</html>
